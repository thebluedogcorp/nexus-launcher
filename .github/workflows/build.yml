name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v10.0.0"
          $title = "NEXUS v10.0.0 — Working media server: MKV/HEVC playback, LAN QR fix, library-edit"
          # Single-quoted here-string (@'...'@) so markdown backticks in the
          # notes aren't interpreted as PowerShell escape characters (they broke
          # the build as a ParserError in the v10.0.0 first attempt).
          $notes = @'
          NEXUS — Universal Game Launcher & Media Server for Windows.

          **v10.0.0 — the media server actually works now.** This release fixes every issue reported against v9.5.0 (server showed nothing, phone couldn't connect, QR didn't open, MKV wouldn't play) and was verified end-to-end with REAL .mkv files + a REAL HTTP server + REAL ffmpeg in a Node integration harness (206 Range streaming, fMP4 remux, auth-code enforcement, multi-IP detection, live library patching — all assertion-tested).

          **MKV / HEVC now play in-browser + in-app (the headline).**
          A new SMART `/play/:id` endpoint auto-selects the playback strategy from FFprobe-probed codecs:
          • Direct Play — browser-native container + codec (MP4/WebM/MOV with H.264/AAC) → raw 206 Range stream, seekable.
          • Remux — MKV (or other non-native container) with supported codecs → ffmpeg `-c copy` remuxes to fragmented MP4, piped to the player. Lossless + fast.
          • Transcode — unsupported codec (HEVC/H.265, VC-1, MPEG-2, FLAC/AC3) → ffmpeg re-encodes to H.264+AAC fMP4.
          The in-app player uses the same smart `nexus-media://media/<id>/play` protocol, so MKV plays inside NEXUS too — no more "open file path in your system player" dead-end.

          **FFprobe probing at scan time.**
          Every scanned file is probed (container, video codec, audio codec, resolution, audio channels, subtitle count, duration, bitrate) and persisted. The UI shows codec/resolution badges + the resolved strategy on each item.

          **LAN connectivity + QR fixed (the "phone can't reach PC" fix).**
          • `detectLanIps()` now returns EVERY non-internal IPv4, sorted by reachability (RFC1918 first), so an Ethernet-connected PC's address is surfaced alongside Wi-Fi/virtual ones. The server dashboard shows one QR per candidate URL — scan each until your phone connects.
          • The QR now encodes `http://<ip>:<port>/?code=<code>` when an auth code is set, so scanned devices don't get 401'd on every API call (this was the "QR doesn't open" bug).
          • A connection-help panel lists every URL + explicit Windows Defender Firewall guidance for the port.

          **Server config library selection fixed (the "server shows nothing" fix).**
          • "New Server" now defaults to exposing ALL libraries (the previous empty default was the #1 real-world cause of a blank server).
          • Inline library toggles on each server row let you add/remove a library on an existing config without delete + recreate (uses the new `updateServerConfig`).
          • A clear warning appears when zero libraries are exposed.

          **Server lifecycle + health.**
          New `/api/health` endpoint (port, all LAN IPs, exposed-library count, auth-required flag, version) + `/api/probe/:id` (probe + strategy). Status reflects the real `http.Server.listening` state. Port-conflict → `port-in-use` error string.

          **UI polish.**
          Cinematic card hover (poster zoom + scrim + accent ring), taller detail backdrop with gradient scrim + poster shadow + refined typography, responsive multi-URL server dashboard.

          **Still clean — no piracy.** Only files from your configured libraries, looked up by id from the local DB. Gaming fully untouched.

          **Downloads:**
          - NEXUS-Setup-10.0.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-10.0.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit. FFmpeg/FFprobe are bundled with the app.
          '@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
