name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v6.3.0"
          $title = "NEXUS v6.3.0 — Keyboard shortcuts overlay, Recently Viewed rail, cast hover, polish"
          $notes = @"
          NEXUS — Universal Game Launcher & Entertainment Hub for Windows.

          **v6.3.0 — Discoverability + memory. A keyboard-shortcuts overlay, a Recently Viewed history rail, and tactile cast/back polish.**

          **New: Keyboard Shortcuts overlay (press ?).**
          A clean two-column modal surfaces every NEXUS TV shortcut — Navigation (Ctrl+K, /, g, Esc, ?), Browse (arrows, Enter), Hero (hover arrows, dots), and Player (Esc, S/E inputs). Opens with `?` or the new keyboard icon at the bottom of the sidebar. Closes on Esc, ?, /, or click-outside. Makes the keyboard-first design fully discoverable.

          **New: Recently Viewed rail.**
          The home screen now shows a "Recently Viewed" rail (with a clock icon) of the last 18 detail pages you've visited — persisted locally, survives restarts. Each card shows the backdrop, type chip, title, and year. A "Clear" button wipes the history. Dedupes by title so re-visits float to the top. The detail page records the visit as soon as TMDB details load.

          **New: history store.**
          `ent-store` now exports `getHistory()`, `recordHistory()`, `clearHistory()`, and `HistoryEntry` — a third local store alongside My List + Continue Watching.

          **New icons.**
          Added `Icon.Keyboard` and `Icon.Clock2` to the icon set.

          **Polish.**
          - Hero rating badge now a proper amber pill (bg + border + bold).
          - Detail-page back pill slides left + turns rose on hover.
          - Cast cards lift 3px on hover with a rose ring around the avatar.
          - Shortcuts overlay has backdrop blur + scale-in animation.
          - Full keyboard a11y: shortcuts overlay closes on capture-phase Esc.

          All v6.2.0 functionality preserved: command palette (Ctrl+K), hero manual arrows + Up Next, NEW badges, card sheen, hover preview popovers, Top 10 rail, arrow-key nav, scroll-to-top FAB, view transitions, full CineSrc streaming playback, TMDB IPC in main process, mode switching, library, collections, platform detection, launching, playtime, achievements, overlay, console/desktop mode, themes, 4 first-party plugins.

          **Downloads:**
          - NEXUS-Setup-6.3.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-6.3.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
