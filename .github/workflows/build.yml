name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v4.5.2"
          $title = "NEXUS v4.5.2 — Intelligent zero-config Get button: auto-resolves the official store page (Steam deep-link, GOG, Epic, Xbox) for any game"
          $notes = @"
          NEXUS — Universal Game Launcher for Windows.

          **v4.5.2 — Intelligent Get button (zero-config store redirect).**

          When a game isn't installed, clicking Get no longer requires any source setup. The launcher figures out which official store carries the game and opens its buy/store page in the browser:

          - **Steam** — if the game has a steamAppId (from detection), deep-links straight to store.steampowered.com/app/<id>. Otherwise, a live search of the public Steam storesearch API finds the exact app by title and deep-links to it. Verified: 'Elden Ring' -> app 1245620, 'Celeste' -> app 504230. Falls back to Steam's search-results page if no match.
          - **GOG** — deep-links to the GOG game page when a gogId is known or the catalog search finds a match; else opens GOG's search-results page.
          - **Epic Games** — opens the Epic Games Store search results for the title (no reliable public per-game API).
          - **Xbox / Microsoft Store** — opens the Microsoft Store search results.
          - **Web search** — catch-all that opens a web search for buying the game.

          The Get-game picker (AcquisitionPicker) is now store-focused: it lists 'Get on Steam', 'Get on GOG', 'Search on Epic', 'Search on Xbox', 'Search the web'. Click any -> opens that official site in the default browser. No download sourcing, no user configuration, no piracy — just intelligent redirection to the legitimate store page where the user can buy or download the game.

          All v4.5.x functionality preserved: availability-aware actions (Get/Play), download manager (for direct HTTP sources a user is authorized to use, with Range resume + integrity verification), the open-source catalog, the Downloads panel, Theme Studio, collections.

          **Downloads:**
          - NEXUS-Setup-4.5.2.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-4.5.2.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
