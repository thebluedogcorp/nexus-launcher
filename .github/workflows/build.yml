name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v4.3.1"
          $title = "NEXUS v4.3.1 — No emojis as icons: real platform logos + lucide icon library everywhere"
          $notes = @"
          NEXUS — Universal Game Launcher for Windows.

          **v4.3.1 — Icon cleanup pass.** The app no longer uses emojis as icons anywhere. Every icon now comes from a recognized icon library (lucide-react) or the official brand logo SVG.

          **What changed:**

          1. **Real platform logos** — the 8 store brands (Steam, Epic, GOG, Xbox, Ubisoft, Battle.net, EA, Riot) now use their OFFICIAL single-color SVG path data sourced from simple-icons (the open brand-logo collection traced from each brand's own assets). These are the real logos, not stylized interpretations. Manual/Custom use clean geometric SVG glyphs.

          2. **No emojis as icons** — installed the lucide-react icon library and replaced every emoji used as an icon:
             * **Achievements** — the 20 achievement icons (was 🎮📚🏆▶️🎯🔥⭐💖✅🎖️📝🔍✨⏰⌛🌐⚙️📁💾🤿) are now lucide SVG keys (gamepad, library, trophy, play, target, flame, star, heart, check, award, pencil, search, sparkles, clock, hourglass, globe, settings, folder, save, waves).
             * **Collections** — the 24-icon picker (was 📁🎮🏆⭐❤️🔥🎯🎲🎨🚀⚔️🛡️🌌🧟🏰💎🕹️🧩👾🎬📚💀🌟⚡) is now 24 lucide SVG keys (folder, gamepad, trophy, star, heart, flame, target, dice, palette, rocket, swords, shield, globe, skull, gem, joystick, puzzle, film, book, zap, bookmark, clock, sparkles, crown).
             * **Smart Collections** — the 7 built-in collections (All Games, Favorites, Recently Played, Currently Playing, Backlog, Never Played, Top 10 Played) now use lucide icons (library, star, clock, gamepad, clipboard, sparkles, trophy).
             * The **achievement toast** no longer prefixes with a 🏆 emoji.
             * The **'Unlocked' label** uses a real check icon instead of a ✓ glyph.
             * The **'Avg rating' stat** uses a real star icon instead of a ★ glyph.
             * The **game-page JSON reference** heading uses a FileCog icon instead of a 📋 emoji.
             * The **search-suggestion rating** uses a real star instead of a ★ glyph.
             * The **controller-hints menu key** uses a Settings gear instead of a ☰ glyph.

          3. **Icon-key system** — new IconGlyph component + resolveIconGlyph() map a string KEY (e.g. 'trophy') to a lucide component. Collections and achievements store icon KEYS in the database (never emojis). The DB migration UPSERTs every existing achievement + Smart Collection row so v4.3.0 emoji icons get refreshed to the new keys on upgrade. Old user-created collections with emoji icons fall back to a Folder icon (re-pickable via the edit dialog).

          All v4.3.0 functionality preserved: collections system, Smart Collections, collapsible/customizable sidebar, per-collection accent, pinning, real platform logos.

          **Downloads:**
          - NEXUS-Setup-4.3.1.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-4.3.1.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
