name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v9.4.0"
          $title = "NEXUS v9.4.0 — Restored game launcher + rebuilt Media Server (fixes v9.3.0)"
          $notes = @"
          NEXUS — Universal Game Launcher & Media Server for Windows.

          **v9.4.0 — fixes the broken v9.3.0. The original game launcher is back, and entertainment is rebuilt from the ground up as the local Media Server.**

          **Restored: the game launcher.**
          v9.3.0 shipped an unfinished "universal shell" that removed the Games & Entertainment startup selector and left the game launcher unusable. v9.4.0 reverts that. The startup selector is back, and the full game launcher works again — auto-detection across Steam, Epic, GOG, Battle.net, EA, Ubisoft, Riot and Xbox, RAWG metadata, library, collections, playtime, stats, plugins, themes, one-click launch.

          **Rebuilt: Media Server (the new second mode).**
          The old TMDB "NEXUS TV" entertainment mode is torn down. The second mode is now the local Media Server: browse, play, and host your own video files. Scan your folders, play in-app with full seeking (nexus-media:// protocol, HTTP Range / 206), and share your library to other devices on your LAN via QR + access code. MP4/WebM/MOV play in-browser; other containers show their file path for a system player. Your files only — nothing uploaded, no cloud.

          **Still clean — no piracy.**
          No third-party stream hosts are embedded or routed. Entertainment serves ONLY files on the user's own disk. The game launcher is fully preserved.

          **Downloads:**
          - NEXUS-Setup-9.4.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-9.4.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
