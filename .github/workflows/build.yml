name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v4.4.0"
          $title = "NEXUS v4.4.0 — Theme Studio: visual drag-free theme builder with live preview, presets, undo/redo, save/import/export"
          $notes = @"
          NEXUS — Universal Game Launcher for Windows.

          **v4.4.0 — Theme Studio.** A full visual theme builder that lets every user transform the launcher into their own personalized gaming environment. Built on a versioned theme schema + design-token system; drives the REAL launcher via ~60 CSS custom properties (the existing variable-driven stylesheet re-themes instantly), so changes affect the actual interface, not a mockup.

          **What's new:**

          1. **Theme Studio editor** (open via the palette button in the topbar) — a 4-area full-screen editor:
             * **Top toolbar** — preset/theme picker, undo, redo, reset, import, export, Save As, Apply, Cancel. Keyboard shortcuts: Ctrl+Z undo, Ctrl+Shift+Z redo, Ctrl+S apply.
             * **Layer explorer (left)** — select which component to edit (Game Card, Library Grid, Sidebar, Topbar, Background, Typography, Colors & Accent, Animations, Layout).
             * **Live preview canvas (center)** — a mini launcher (topbar + sidebar + game grid) reusing the REAL launcher's CSS classes so it reflects the draft instantly. pointer-events:none.
             * **Property inspector (right)** — categorized controls (sliders, color pickers, selects, toggles, segmented buttons) bound to the draft.

          2. **What's customizable** — colors (bg, surfaces, borders, text, accent, danger), typography (font family, base/title sizes, line height, letter spacing), radius scale (sm/md/lg/xl), spacing multiplier, shadows (low/mid/high), game card (aspect ratio 3:4/2:3/1:1/16:9, min width, gap, radius, border opacity, shadow level, hover lift, density compact/cozy/comfortable, show title/platform/playtime), sidebar (width 180-320, position left/right, background), topbar (height, background, transparency, border opacity), background (solid/gradient/image, blur, overlay opacity, parallax), animations (speed multiplier, hover effects, card entrance, reduced motion), color mode (dark/light), library view (grid/list), section visibility.

          3. **10 built-in presets** — NEXUS Default, Minimalist Dark, Modern Gaming Dashboard, Steam-Inspired Library, Cyberpunk Neon, Glassmorphism, AMOLED Black, Retro Gaming, Clean Light, Artwork-Focused Immersive, Compact Power-User. Start from a preset and customize everything.

          4. **Personal themes + persistence** — multiple saved themes per user; name, duplicate, rename, delete; live preview before applying; undo/redo (100-step stack); reset to default; import/export theme JSON; recovery from broken configs (validateTheme fills missing fields; applyTheme never throws — reverts to default on error). Themes stored as versioned JSON in a new 'themes' DB table. The active theme applies on startup.

          5. **Architecture** — React + TypeScript; Zustand for editor state + undo/redo; CSS custom properties + design tokens for live theming; the existing Electron stack (no new desktop framework). Presets are seeded into the DB as read-only builtin rows; personal themes are editable copies.

          6. **Stability** — theme failures can't prevent the launcher from opening (applyTheme wraps in try/catch + reverts to DEFAULT_THEME). Game detection, launching, platform integrations, and all v4.3.x functionality are unchanged. Editor state is separate from saved config.

          **Roadmap (documented, not in this release):** full drag-reorder of sidebar sections (dnd-kit installed for this), dashboard widget drag-resize (react-grid-layout), per-component reusable style presets, theme sharing, cloud sync.

          **Downloads:**
          - NEXUS-Setup-4.4.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-4.4.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
