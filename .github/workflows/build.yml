name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v4.2.0"
          $title = "NEXUS v4.2.0 — UI polish: fixed mode-toggle, pure black/white + single accent, minimal N lettermark logo + icon"
          $notes = @"
          NEXUS — Universal Game Launcher for Windows.

          **v4.2.0 — UI polish & minimalism pass.** Every button, badge, and bar cleaned up so the whole launcher follows ONE design rule: pure black + white + a single user-configurable accent color.

          **What's fixed / changed:**

          1. **Mode toggle bug fixed** — the Console/Desktop switch in the top bar had a hardcoded "active" state on the Desktop button, so it always looked selected (even in Console mode). The active class is now driven by the actual `uiMode` state via a dedicated `<ModeToggle>` component, so the switch reflects the real layout every time. Both topbars (Console and Desktop) share the same component.

          2. **Single accent color, everywhere live** — introduced a `--accent-rgb` token. Every teal tint (favorites, ratings, status pills, progress bars, badges, focus rings, scan sweep, hover-play, toast borders, etc.) is now `rgba(var(--accent-rgb), …)` so when you pick a new accent in Settings → Appearance it propagates to the whole UI instantly — and survives a restart (the saved accent is applied on startup, before the first paint). The old gold/blue second hues are gone; favorites and ratings now use the accent.

          3. **No gradients on fills** — the logo, the primary "Add" button, the "Play" CTA, progress bars, the empty-state box, the about card, achievement unlocked cards, the enrichment banner, and all stat/dash/progress bars are now SOLID. Backgrounds are pure black (`#000`) with near-black surface lifts. Buttons lift on hover with subtle elevation, no glow.

          4. **Minimal N lettermark logo** — replaced the Gamepad icon with a crisp geometric "N" drawn from a single SVG path (`NexusMark`). Used identically in the top bar (accent on black), the desktop sidebar header, the Settings → About card, and the app icon. The old gradient logo tile is gone.

          5. **New app icon** — regenerated `resources/icon.ico` (multi-res 16–256) and `resources/icon.png` (1024) as a solid black rounded square with the single accent "N" — matching the in-app logo exactly.

          6. **Sleek desktop sidebar** — added a compact brand header (black tile + accent N + "LIBRARY" label) and a crisp left accent bar on the active nav item (like VS Code / Epic). Mode-toggle active state is now an accent-tinted pill.

          7. **Broken `var(--nx-accent)` references fixed** — AddGameDialog, ScanDialog, UpdateDialog, and SettingsDialog referenced an undefined `--nx-accent` CSS variable; all now use the real `--accent` token.

          All existing functionality preserved: Console carousel + controller nav, Desktop grid, achievements, activity, real playtime tracking, in-game overlay, game detail page, collections, scan wizard, add-game dialog, RAWG metadata patch, stats dashboard, enrich-all, startup & close behavior.

          **Downloads:**
          - NEXUS-Setup-4.2.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-4.2.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
