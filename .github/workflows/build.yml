name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v4.5.0"
          $title = "NEXUS v4.5.0 — Smart game acquisition: availability-aware actions (Get/Download/Play), pluggable source adapters, download manager with resume"
          $notes = @"
          NEXUS — Universal Game Launcher for Windows.

          **v4.5.0 — Smart Game Acquisition + Download Sources.**

          **1. Fixed the availability bug (the core ask).** A game in the library that isn't installed no longer shows 'Play Now'. Each game now carries a verified 'installed' flag; the card + detail page show the right action:
          - Installed + launchable -> **Play Now**.
          - In library but not installed, with an acquisition path -> **Get** (opens the acquisition picker).
          - Active download -> in-card progress bar + a **View download** button.
          - Download completed + verified -> **Play Now**.
          - Missing source -> a clear explanation + alternatives.
          The flag is verified against the real install state on startup (verifyAllInstalled) and after every download completes — never assumed from library presence alone.

          **2. Pluggable source-adapter system.** A consistent DownloadSource interface + a registry that resolves acquisition options per game. Three real adapters:
          - **open-source-catalog** — 10 real free/open-source games (SuperTuxKart, 0 A.D., Mindustry, OpenTTD, Shattered Pixel Dungeon, Battle for Wesnoth, Veloren, Endless Sky, Freeciv, Cataclysm: DDA) each linked to its OFFICIAL download page. Fuzzy title matching.
          - **store-link** — official store pages (Steam store by app id; others fall back to their storefront). 'View Store' opens the real store page in the browser.
          - **user-http** — user-configured direct HTTP(S) downloads for content the user is authorized to download. Managed in Settings.
          Adapters truthfully report capabilities (search/download/storePage/ownership). Adding a new authorized source = adding a branch in registry.ts.

          **3. Download manager.** A native download engine (global fetch + ReadableStream reader) that streams to disk with:
          - **Range resume** — pause keeps the partial file + bytes; resume re-issues GET with 'Range: bytes=<n>-' (append mode).
          - **Pause / Cancel / Retry** — AbortController aborts the in-flight fetch; cancel deletes the partial file; retry restarts from 0.
          - **Integrity verification** — on completion, verifies the written file size matches Content-Length; if the source provided a sha256, verifies the hash. Only on success does it call markGameInstalled + transition the job to 'completed'.
          - **Concurrency limit** — max 2 concurrent transfers; the rest stay queued.
          - **Persistent jobs** — the downloads DB table survives restarts; jobs left mid-transfer are flipped to 'paused' (the in-memory controller was lost) so the user can resume.
          - **Progress events** — throttled to 4/sec, sent to the renderer + persisted.
          - **Full UI** — a Downloads panel (topbar button) with active/queued/completed/failed sections, per-job progress bars, overall progress, + pause/resume/cancel/retry/clear controls.

          **4. Security.** Only http(s) URLs are accepted (no file://, no local-network bypass). Filenames are sanitized (no path traversal). Downloaded files are NEVER auto-executed — the user must explicitly launch. No DRM bypass, no unauthorized sources, no piracy integration (Hydra's torrent/repack sources were explicitly NOT implemented; only authorized distribution).

          **5. Verified.** The download engine was smoke-tested end-to-end against a real public-domain file (Project Gutenberg, 772KB): full transfer + sha256 + size verification passed; Range-resume (206 + append) reconstructed the file correctly.

          All existing functionality preserved: library, collections, platform detection, launching, playtime tracking, achievements, overlay, Theme Studio.

          **Roadmap (documented, not in this release):** ownership/entitlement verification (needs platform OAuth), update detection, torrent adapter for legally-distributable P2P content, dashboard widget for downloads.

          **Downloads:**
          - NEXUS-Setup-4.5.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-4.5.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
