name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v9.2.0"
          $title = "NEXUS v9.2.0 — Removed third-party stream embedding; entertainment is now browse-only"
          $notes = @"
          NEXUS — Universal Game Launcher & Entertainment Hub for Windows.

          **v9.2.0 — a clean release. All third-party stream embedding has been removed.**

          NEXUS no longer embeds or routes to any third-party streaming host. The CineSrc / 2Embed / VidSrc embed player, the stream-source selector, and the offline-package downloads of third-party content have all been removed. The Content-Security-Policy has been tightened (cinesrc.st removed from frame-src).

          **Entertainment is now browse-only.**
          TMDB metadata (movies, TV, anime, Hindi cinema), search, discover, recommendations, and YouTube trailers remain fully functional. There is no embedded playback of third-party streams. Opening a title's Watch flow now shows a clear notice that streaming was removed.

          **A local media server arrives in v9.3.0** — stream your own files (DVDs, rips, recordings — anything you already own) from your own machine, with QR / invite-code access on your local network.

          **Game launcher fully preserved.**
          Auto-detection across Steam, Epic, GOG, Battle.net, EA, Ubisoft, Riot and Xbox. RAWG metadata. Library, favorites, playtime tracking, plugins, command palette, and the in-app auto-updater all work as before.

          **Downloads:**
          - NEXUS-Setup-9.2.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-9.2.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
