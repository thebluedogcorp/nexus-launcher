name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v3.9.2"
          $title = "NEXUS v3.9.2 — Fixed Steam game auto-detection"
          $notes = @"
          NEXUS — Universal Game Launcher for Windows.

          **v3.9.2 — Fixed Steam game auto-detection** (user reported Steam games not being detected automatically, had to add them manually).

          The Steam detector was rewritten with 5 fallback methods for finding the Steam install, plus extensive logging so you can see exactly what's happening when detection fails:

          **5 methods to find the Steam install directory:**
          1. Registry HKCU Software Valve Steam SteamPath (with /reg:32 and /reg:64 fallbacks for 32/64-bit view issues)
          2. Registry HKLM SOFTWARE WOW6432Node Valve Steam InstallPath (and the 32-bit SOFTWARE Valve Steam path)
          3. Running process detection — wmic finds steam.exe and gets its directory (works if Steam is currently running)
          4. Filesystem scan of common default locations on ALL drive letters (C, D, E, F, G) — catches Steam installed on D: Steam or F: Games SteamLibrary etc.
          5. Last resort — checks if a steamapps folder exists anywhere on C/D/E/F/G drives

          **2 methods to read library folders:**
          A. libraryfolders.vdf (modern Steam) — the primary source
          B. config.vdf BaseInstallFolder entries — fallback if libraryfolders.vdf is missing or doesn't list all libraries

          **Also fixed:**
          - SteamPath from registry uses forward slashes — now normalized to backslashes before the existsSync check.
          - Library folder paths from VDF also normalized (forward slashes to backslashes).
          - Library folder paths from config.vdf also normalized.
          - The steamapps subdirectory is now correctly resolved for library folders that don't end in steamapps — the detector checks if the library path ends in steamapps and if not, appends steamapps automatically. This fixes detection when Steam libraries are on D: SteamLibrary (where manifests are at D: SteamLibrary steamapps).
          - Added extensive console.log / console.warn logging throughout the detection flow so the user can see exactly what's happening (Steam install found at..., Found N library folder(s), Found N manifest(s), Detected: game name, etc.). These logs appear in the Electron main process console / dev tools.

          **Before this fix:**
          - The detector only checked C: Program Files (x86) Steam and C: Program Files Steam as fallbacks — if Steam was on D: drive, detection failed silently.
          - No logging — the user had no way to know WHY Steam detection wasn't working.
          - No config.vdf fallback — if libraryfolders.vdf was missing or incomplete, some Steam libraries were missed.

          **After this fix:**
          - Steam install is found via 5 different methods — registry, 32/64-bit view, running process, filesystem scan across 5 drives, and last-resort steamapps existence check.
          - Library folders are read from BOTH libraryfolders.vdf AND config.vdf — if one is missing or incomplete, the other fills the gap.
          - Every step is logged so the user can see exactly what's happening in the console.

          Auto-detects every installed game across Steam, Epic, GOG, Battle.net, EA, Ubisoft, Riot and Xbox, patches rich metadata via the RAWG + Steam APIs, and launches games natively.

          **Downloads:**
          - NEXUS-Setup-3.9.2.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-3.9.2.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
