name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v4.3.0"
          $title = "NEXUS v4.3.0 — Collections system, platform logos, collapsible sidebar, Smart Collections"
          $notes = @"
          NEXUS — Universal Game Launcher for Windows.

          **v4.3.0 — Library organization & personalization pass.** A full collections system (user-curated groups + auto-generated Smart Collections), real platform logos instead of colored dots, and a collapsible, customizable sidebar.

          **What's new:**

          1. **Collections system** — create your own groups to organize your library however you like. Build a 'GTA' collection, a 'Currently Playing' shelf, a 'Backlog', anything. Each collection is fully customizable:
             * **Folder emoji** picker (24 marks) when creating.
             * **Per-collection accent color** — give the collection its own accent (or inherit the global accent). The active collection's color shows on the sidebar item + view header.
             * **Optional description** + **pinning** (pinned collections float to the top).
             * **Add games** from the right-click context menu, the game detail page, or a dedicated picker dialog that lists every collection with live checkmarks.
             * **Edit / delete** from the collection view header or Settings -> Sidebar.
             * Collections export/import with the library backup.

          2. **Smart Collections (auto-generated)** — 7 built-in, read-only collections seeded on first run whose membership is computed live from your activity:
             * **All Games**, **Favorites**, **Recently Played** (last 30 days), **Currently Playing** (status=playing), **Backlog** (status=backlog), **Never Played**, **Top 10 Played**.
             * They update automatically as you play, favorite, and change statuses — no manual curation needed.
             * Can't be deleted (they're virtual), but can be hidden via the collapse chevron.

          3. **Real platform logos** — replaced the generic colored dots beside platform names with crisp, original SVG logo marks for Steam, Epic, GOG, Battle.net, EA, Ubisoft, Riot, Xbox, Manual, and Custom. Shown in the sidebar, on game cards, in the console filter pills, and on the game detail page. Monochrome (inherit the accent in active states).

          4. **Collapsible sidebar (both modes)** — the Collections and Platforms sections each have a chevron that collapses them; your choice persists across restarts. The console-mode filter row respects the same visibility settings.

          5. **Customizable platform list (Settings -> Sidebar)** — toggle which platforms appear in the sidebar list. Hidden platforms still show on game cards, they just don't clutter your nav. A 'Manage Collections' panel lets you pin/unpin/delete from one place. A 'Collapse Behavior' section sets the default expanded/collapsed state.

          6. **Autonomous ideas included** — the per-collection accent color, pinning, and Smart Collections are themselves autonomous features beyond the literal request.

          All v4.2.0 polish is preserved: the fixed mode-toggle, single-accent-everywhere token system, minimal N lettermark logo + icon, pure black/white aesthetic.

          **Downloads:**
          - NEXUS-Setup-4.3.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-4.3.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
