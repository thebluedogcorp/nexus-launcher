name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v6.4.0"
          $title = "NEXUS v6.4.0 — Toast notifications, Surprise Me, tactile polish"
          $notes = @"
          NEXUS — Universal Game Launcher & Entertainment Hub for Windows.

          **v6.4.0 — Feedback + serendipity. Toast notifications for every action, a Surprise Me random-pick, and tactile micro-polish.**

          **New: Toast notification system.**
          A lightweight pub/sub toast store (EntToaster) renders a bottom-left stack of glass toasts with kind-colored icons (success=green, info=rose, error=red). Auto-dismisses after 3.2s, manually dismissible. Wired into: add/remove from My List ("Added 'X' to My List" / "Removed 'X' from My List"), start watching ("Now playing: X"), clear history ("History cleared"), and Surprise Me ("Surprise! Playing X").

          **New: Surprise Me.**
          A gradient callout bar sits between the hero and the rails: "Can't decide? Let NEXUS pick something for you." Click the rose "Surprise Me" button and it picks a random title from trending + popular TV and immediately starts playing it — with a toast confirming the pick. Perfect for indecisive moments.

          **New icon.**
          Added `Icon.Shuffle` to the icon set.

          **Polish.**
          - Rail titles now reveal a short rose underline on hover.
          - Focused cards (keyboard nav) get an enhanced rose glow ring + soft halo.
          - Detail-page tagline gets a rose left accent bar.
          - Provider cards lift 2px on hover with a rose border.
          - Genre chips get an inset top highlight on active.
          - Surprise bar stacks vertically on narrow screens.

          All v6.3.0 functionality preserved: keyboard shortcuts overlay (?), Recently Viewed rail, command palette (Ctrl+K), hero manual arrows + Up Next, NEW badges, card sheen, hover preview popovers, Top 10 rail, arrow-key nav, scroll-to-top FAB, view transitions, full CineSrc streaming playback, TMDB IPC in main process, mode switching, library, collections, platform detection, launching, playtime, achievements, overlay, console/desktop mode, themes, 4 first-party plugins.

          **Downloads:**
          - NEXUS-Setup-6.4.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-6.4.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
