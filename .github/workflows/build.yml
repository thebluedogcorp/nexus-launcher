name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v4.6.5"
          $title = "NEXUS v4.6.5 — RAWG API key buttons hidden under trailer layer + per-game trailer URL field + auto-detect trailers on startup"
          $notes = @"
          NEXUS — Universal Game Launcher for Windows.

          **v4.6.5 — Immersive trailer previews + premium visual polish.**

          **1. Game trailer preview system.** Games with a RAWG trailer clip now show a muted, looping video preview in three places:
          - **Game cards (desktop grid):** hover a card for 400ms -> the trailer plays over the cover art. Only ONE card plays at a time (the last hovered). Quick mouse-overs don't trigger playback (debounced).
          - **Game detail hero:** the cinematic hero banner shows the trailer overlaid on the background art.
          - **Console-mode background:** the focused game's trailer plays full-screen behind the entire UI (cinematic immersive mode).
          Trailers are muted by default, loop, playsInline. On error/unavailable -> graceful fallback to the static poster. When auto-play is off or the user has requested reduced motion -> always shows the poster. Never blank, never stuck loading.

          **Auto-play setting:** Settings -> Appearance -> Game Trailers -> 'Auto-play game trailers' toggle (On/Off). Persists across restarts. Default: On.

          **Trailer metadata architecture:** the RAWG clip field (mp4 URLs at 320/640/1280 resolution) is extracted during metadata patching + stored in a new 'trailerUrl' DB column. The metadata patcher + the enrich-all flow + the add-game flow all capture it. The trailer is associated by RAWG game id (stable), not by title. No video files are downloaded or stored — the mp4 is streamed from RAWG's CDN at view time.

          **NOTE:** The built-in default RAWG API key has expired (401). To get trailers + all metadata (cover art, descriptions, etc.), set your own free RAWG key in Settings -> General -> RAWG API Key (get one at https://rawg.io/apilogin). This is a pre-existing issue affecting all metadata, not just trailers.

          **2. Premium visual polish.** Cinematic card hover (cover zoom + accent glow), atmospheric topbar sheen, staggered nav-tab entrance, focus-visible rings for keyboard nav, hero parallax zoom, smoother modal transitions, refined loading skeletons.

          **3. Animations + microinteractions.** Staggered card entrance (gcIn), smooth modal scale-in, sidebar collapse transition, tab entrance stagger, focus-visible accent rings, hero parallax zoom (20s ease-out), shimmer loading skeletons. All respect [data-reduced-motion].

          All existing functionality preserved: library, collections, platform detection, launching, playtime tracking, achievements, overlay, Theme Studio, Smart Collections, collapsible sidebar, real platform logos, intelligent Get button, install detection (Play/Get).

          **Downloads:**
          - NEXUS-Setup-4.6.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-4.6.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
