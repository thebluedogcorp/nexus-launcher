name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v1.6.0"
          $title = "NEXUS v1.6.0 — True PS5 UI clone"
          $notes = @"
          NEXUS — Universal Game Launcher for Windows.

          **v1.6.0 — True PS5 UI clone:**
          - **No sidebar.** Removed the entire left sidebar — PS5 has no sidebar.
          - **Top nav bar (PS5 style):** brand left, centered pill nav (Home / Favorites / Library) with live counts, icon cluster right (search, scan, add, settings).
          - **Square (1:1) tiles** in a horizontal carousel — was portrait 3:4. The selected tile scales to 1.25x + lifts, with the PS5 signature **blue glow border** (#00a8e1); non-focused tiles dim to 50% brightness + desaturate + scale 0.92 (PS5 cover-flow depth).
          - **Info panel below the carousel (PS5 style):** centered 38px title, metadata strip, 3-stat block (Time Played / Launches / Size — or Last Played), Play / Details / Favorite pill buttons.
          - **Full-bleed cinematic background** of the focused game with PS5-style overlay (darkest top + bottom, lighter center where the focused tile sits).
          - PS5 blue accent (#00a8e1) replaces emerald as the primary selection color.
          - Pill-shaped buttons (border-radius 999px) throughout.
          - Platform filter row only appears when you click Library (otherwise hidden — no clutter).
          - Expandable search (icon expands into an input).

          Auto-detects every installed game across Steam, Epic, GOG, Battle.net, EA, Ubisoft, Riot and Xbox, patches rich metadata via the RAWG + Steam APIs, and launches games natively.

          **Downloads:**
          - \`NEXUS-Setup-1.6.0.exe\` — NSIS installer (recommended, supports auto-update). Creates desktop + Start Menu shortcuts.
          - \`NEXUS-Portable-1.6.0.exe\` — single-file portable build, no install required.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
