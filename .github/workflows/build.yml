name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v6.7.0"
          $title = "NEXUS v6.7.0 — Genre quick-bar on home, Copy Link on detail, polish"
          $notes = @"
          NEXUS — Universal Game Launcher & Entertainment Hub for Windows.

          **v6.7.0 — Faster discovery + sharing. A genre quick-filter bar on the home screen and a Copy Link button on every detail page.**

          **New: Genre quick-filter bar on home.**
          Between the Surprise Me bar and the rails, home now shows a "Browse by genre" bar with 14 genre chips — 8 movie genres (Action, Adventure, Animation, Comedy, Crime, Documentary, Drama, Family) + 6 TV genres, separated by a divider. Click any chip and you jump straight to the filtered browse page with that genre pre-selected and active. The browse page's genre state syncs with the pre-selection and clears it when you manually change genres.

          **New: Copy Link button on detail pages.**
          Every detail page now has a "Copy Link" button (after IMDb) that copies the title's TMDB URL (themoviedb.org/{type}/{id}) to the clipboard. Success fires a "Link copied to clipboard" toast; failure fires an error toast. The button has a subtle rose-tinted accent so it stands out.

          **Polish.**
          - Genre chips get a hover lift + rose border.
          - TV genre chips are rose-tinted to distinguish from movie genres.
          - Copy Link button gets a rose-tinted accent.
          - Genre bar divider hides on narrow screens.
          - Browse pre-selection logic: initialGenre prop + onGenreCleared callback so the shell and browse stay in sync.

          All v6.6.0 functionality preserved: hero Watch Trailer modal, ambient detail backdrop, settings panel, My List badge, Surprise/Settings shortcuts, toast notifications, Surprise Me bar, command palette (Ctrl+K), hero manual arrows + Up Next, NEW badges, card sheen, hover preview popovers, Top 10 rail, arrow-key nav, scroll-to-top FAB, view transitions, keyboard shortcuts overlay, Recently Viewed rail, full CineSrc streaming playback, TMDB IPC in main process, mode switching, library, collections, platform detection, launching, playtime, achievements, overlay, console/desktop mode, themes, 4 first-party plugins.

          **Downloads:**
          - NEXUS-Setup-6.7.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-6.7.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
