name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v4.5.3"
          $title = "NEXUS v4.5.3 — Fixed install detection (manual games now show Get, not Play) + removed all download-management residue"
          $notes = @"
          NEXUS — Universal Game Launcher for Windows.

          **v4.5.3 — Two fixes.**

          **1. Fixed the install-detection bug (the real issue).** A manually-added game with no files on disk was still showing 'Play Now'. Root cause: createGame relied on the column default (installed=1), so every freshly-added game was marked installed immediately — even with no executable. Fix:
          - createGame now computes the REAL install state at insert time via computeInstalled(): installed = (executable exists on disk) OR (installDir exists) OR (launchCommand is a known GAME protocol — steam://, com.epicgames.launcher://, gog://, battlenet://, etc.). http(s):// store URLs do NOT count as installed (they're web links, not launchable installs).
          - verifyInstalled/verifyAllInstalled use the same launchable-game-URI check (was too permissive — matched http://).
          - updateGame recomputes installed when executable/installDir/launchCommand change (so editing a game flips Play<->Get immediately).
          - verifyAllInstalled runs on startup, so any pre-v4.5.3 manual games flagged wrong get corrected on next launch.
          Now: a game with no executable + no game-protocol launchCommand shows 'Get' (opens the official store picker). A game with a real executable or a steam:// URI shows 'Play Now'.

          **2. Completely removed the download-management system.** The launcher now manages EXISTING installed games + redirects to official stores for acquisition — it does not handle downloads. Removed:
          - The download engine (src/main/downloads/manager.ts — the HTTP streaming/Range-resume/sha256 engine).
          - The source adapter registry + open-source catalog (registry.ts, catalog.ts).
          - The downloads DB table + all download-job CRUD (listDownloads/getDownload/createDownload/updateDownload/deleteDownload/markGameInstalled).
          - The user-HTTP source system (listHttpSources/saveHttpSources + the Settings -> Downloads tab + the SourceEditor modal + import/export).
          - The DownloadsPanel UI + useDownloads hook + the Downloads topbar button.
          - The download-progress events (onDownloadProgress/Added/Removed/Completed).
          - The in-card progress bar + 'View download' hover variant on game cards.
          - The corresponding types (DownloadJob/DownloadStatus/DownloadSourceKind/DownloadSourceDescriptor/DownloadSourceCapability/HttpSourceEntry).
          - The download-engine smoke test.
          Kept: the intelligent store-link resolver (stores.ts — Steam/GOG/Epic/Xbox official-page resolution), the AcquisitionPicker (now store-focused, zero-config), the install-verification system, the 'Get' button.

          The Get flow is now consistent everywhere: not installed -> 'Get' button -> opens the official store picker (Get on Steam / Get on GOG / Search on Epic / Search on Xbox / Search the web) -> opens the store page in the browser. No download sourcing, no residue, no inconsistency.

          All prior functionality preserved: library, collections, platform detection, launching, playtime tracking, achievements, overlay, Theme Studio, Smart Collections, collapsible sidebar, real platform logos, lucide icons.

          **Downloads:**
          - NEXUS-Setup-4.5.3.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-4.5.3.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
