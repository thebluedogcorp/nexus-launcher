name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v9.5.0"
          $title = "NEXUS v9.5.0 — Real local media server + libraries + TMDB identification"
          $notes = @"
          NEXUS — Universal Game Launcher & Media Server for Windows.

          **v9.5.0 — the Media Server mode is now a real personal media platform.**

          **Real local media server (the headline).**
          A real Node HTTP server binds to your LAN (0.0.0.0:port) and serves a browseable web UI + a library API + range-streamed playback at /stream/:id (HTTP 206, Content-Range, Accept-Ranges — seeking works). Start/stop/restart/status reflect the actual server process. The QR code encodes the real http://<lan-ip>:<port> URL and only renders when the server is genuinely running. Port-conflict detection. Other devices on your network scan the QR and browse/play your library from a browser.

          **Multiple media libraries.**
          Create Movies, TV Shows, Anime, Documentaries, Personal, or Custom libraries. Per-library folders via the native folder picker. Create / rename / delete / rescan.

          **Real scanning + indexing.**
          Per-library async scan with live progress. S01E01 / 1x01 filename parsing groups TV episodes under shows with season/episode numbers. Dedup + stale-file reconciliation (moved/renamed/deleted files cleaned up on rescan).

          **TMDB metadata (server-side key).**
          Automatic identification: filename → TMDB search → confidence-based match. Manual identify: search → pick the right title → apply. Movie + TV details (overview, poster, backdrop, genres, runtime, rating, cast, seasons/episodes). The TMDB API key stays in the main process — never sent to the renderer or LAN clients.

          **Playback + resume.**
          In-app HTML5 player with range streaming + Continue Watching (resume from saved position).

          **Onboarding + dashboard + detail pages.**
          Guided first-run setup (pick folder → name library → scan → identify → server). Dashboard rails: Continue Watching, Recently Added, Movies, TV Shows, per-library. Media detail pages with backdrop, poster, metadata, Play, and Identify. TV: season selector + episode list.

          **Server dashboard.**
          Create server configs (name, port, exposed libraries, optional auth code). Real status indicator, real URL + QR, library summary, port-conflict feedback.

          **Entertainment settings + theming.**
          Media Libraries / Media Server / Playback / Appearance / Metadata. Theming wired (presets + live preview + persistence), scoped to entertainment — Gaming stays visually unchanged.

          **Still clean — no piracy.** The server streams ONLY files from your configured libraries, looked up by id from the local DB. No third-party stream hosts. Gaming fully untouched.

          **Deferred (future release):** FFmpeg transcoding (direct play only this release — MKV/AVI that browsers can't play show their file path for a system player), subtitle/audio-track selection, deep per-token theme customizer (presets + apply work now).

          **Downloads:**
          - NEXUS-Setup-9.5.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-9.5.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
