name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v4.1.0"
          $title = "NEXUS v4.1.0 — Redesigned Desktop Mode (Epic-style) + pure black/white theme: Console/ Desktop mode toggle, dark Epic-inspired theme, sidebar settings"
          $notes = @"
          NEXUS — Universal Game Launcher for Windows.

          **v4.0.0 — Complete UI overhaul.** A full redesign of the launcher UI with a darker, more minimal aesthetic inspired by the Epic Games store, plus a brand new Desktop mode alongside the existing PS5-style Console carousel.

          **What's new:**

          1. **Mode toggle (Console ↔ Desktop)** — a new segmented toggle in the top bar switches instantly between:
             * **Console Mode** — the existing PS5-style portrait carousel with controller-friendly navigation. Cards scroll by arrow buttons or gamepad only (the broken mouse-move / mouse-wheel horizontal-scroll detection has been removed, so cards no longer skip around under your cursor).
             * **Desktop Mode** — a brand-new responsive grid view (Steam / Epic-style). Each card shows cover art, title, platform badge, playtime, and last-played. Normal mouse wheel scroll. Click any card to open the game detail page.

             The mode is persisted to localStorage (nx-uimode) and to the database (settings.uiMode), and toggles instantly with no restart required.

          2. **Darker, sleeker color scheme** — inspired by Epic Games' dark UI:
             * Background `#0a0a0c` (near black)
             * Surface `#141418` (cards)
             * Surface hover `#1c1c22`
             * Borders `rgba(255,255,255,0.06)`
             * Text `rgba(255,255,255,0.92)`
             * Subtle teal accent (`#2dd4bf`) — used sparingly so the UI feels mostly monochrome.

          3. **Settings reorganized with a left sidebar** — Settings is no longer a single long scroll. Tabs:
             * **General** — auto-scan, default sort, scan paths
             * **Appearance** — accent color, tile size, animation speed, haptics, UI mode
             * **Library** — export/import, check missing games
             * **Startup & Close** — launch on startup, close behavior
             * **Overlay** — overlay info + test button + widget list
             * **About** — version info + update check

             Each tab shows only the relevant settings.

          4. **Removed broken mousemove scroll** — In console mode the carousel's mousemove-based scroll detection (which moved tiles under the cursor and caused cascading hover on the wrong tile) and the mouse-wheel → horizontal scroll conversion are both gone. Console mode is now strictly arrow-button + keyboard + controller, as it should be. Desktop mode is strictly mouse.

          All existing functionality is preserved: controller navigation, achievements, activity, playtime tracking, overlay, game detail page, collections, scan dialog, add-game dialog, stats dashboard, etc.

          **Downloads:**
          - NEXUS-Setup-4.1.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-4.1.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
