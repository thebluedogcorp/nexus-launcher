name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v7.1.0"
          $title = "NEXUS v7.1.0 — Completely redesigned detail/info page: cinematic hero, rating ring, tabbed panel"
          $notes = @"
          NEXUS — Universal Game Launcher & Entertainment Hub for Windows.

          **v7.1.0 — The detail/info page for every movie & TV show has been completely redesigned. More cinematic, more immersive, more useful.**

          **Redesigned cinematic hero:**
          - Taller (58vh, max 680px) with a deeper dual-gradient blend (bottom + left).
          - Ken Burns zoom on the backdrop (22s slow scale) for a living, cinematic feel.
          - Bigger title (up to 64px, 900 weight, tighter tracking) with deeper text shadow.
          - Italic tagline with max-width for readability.
          - The trailer play ring moved to the upper-center (42% height) so it doesn't crowd the title.

          **New: inline rating ring.**
          The hero now shows a circular SVG rating ring (amber stroke) with the TMDB percentage score inside (e.g. "84%") — a visual score at a glance, next to the year/runtime/seasons/episodes meta and the top-2 genre badges.

          **New: action bar below the hero.**
          A glass action bar with the primary Watch Now (larger 46px), Watch Trailer, IMDb, and Homepage links — plus the resume progress bar (if any) right-aligned. The bookmark/copy-link moved to icon buttons in the top-right of the hero.

          **New: tabbed info panel.**
          The poster (200×300) sits beside a tabbed content area with 4 tabs:
          - **Overview** — full storyline (15px, 1.75 line-height, 880px max), all genre pills, and a quick-facts grid (Director / Status / Runtime / Episodes / Starring).
          - **Cast & Crew** — a responsive grid of cast avatars (80px circles) with name + character, hover-lift with rose ring.
          - **Where to Watch** — streaming provider chips (only shown if providers exist) + a note that NEXUS streams via CineSrc regardless.
          - **Facts** — a 2-column grid of all metadata (Type / Release Year / Runtime / Seasons / Episodes / TMDB Rating / Director / Status / IMDb ID / Genres / Top Cast).
          Tabs animate in on switch. The whole panel has a deeper glass (82% opacity) + entrance animation.

          **New: top-bar icon actions.**
          The back pill stays top-left, but the right side now has glass icon buttons for Add/Remove My List (toggles rose when listed) and Copy Link — cleaner than the old row of full buttons.

          **Cohesion:**
          - Removed all orphaned CSS from the old detail dialog (ent-dp-glass, ent-dp-section, ent-dp-actions, ent-dp-stat, ent-dp-info, ent-dp-ratings, ent-dp-syn) — the new design uses a clean, unified set of selectors.
          - The panel entrance animation (ent-dp-glass-in) is retained for the new .ent-dp-panel.
          - Full responsive: panel collapses to single-column on narrow, poster shrinks to 140×210, cast grid densifies.

          All v7.0.0 functionality preserved: keep-alive home, Ken Burns hero, Because You Watched rail, glitch fixes, immersive screen real estate, settings panel, My List badge, Surprise/Settings shortcuts, toast notifications, Surprise Me, command palette (Ctrl+K), hero manual arrows + Up Next, NEW badges, card sheen, hover preview popovers, Top 10 rail, arrow-key nav, scroll-to-top FAB, keyboard shortcuts overlay, Recently Viewed rail, full CineSrc streaming playback, TMDB IPC in main process, mode switching, library, collections, platform detection, launching, playtime, achievements, overlay, console/desktop mode, themes, 4 first-party plugins.

          **Downloads:**
          - NEXUS-Setup-7.1.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-7.1.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
