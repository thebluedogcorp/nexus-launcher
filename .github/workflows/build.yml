name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v4.10.0"
          $title = "NEXUS v4.10.0 — Plugin auto-update system + installer cache cleanup (answers 'where does the installer go?') + all 12 first-party plugins bumped"
          $notes = @"
          NEXUS — Universal Game Launcher for Windows.

          **v4.10.0 — Plugin auto-update + installer cache cleanup.**

          **1. Plugin auto-update system.** When NEXUS ships a newer first-party plugin catalog (via the embedded FIRST_PARTY_PLUGINS constant in the renderer), users running an OLDER installed version now get an upgrade path. The Plugins tab auto-checks for updates on mount, shows an amber 'N updates' pill in the header, a 'Check for updates' button in the toolbar, and a 'v1.X.0 available' badge + Update action button on each outdated installed row. Clicking Update overwrites the manifest + entry .js in place — the per-plugin data.json + meta status + enabledAt are PRESERVED, so an enabled plugin stays enabled after the update (no re-enable required).

          **2. Installer cache cleanup (answers the question: 'where does the installer go?').** When NEXUS auto-updates, it downloads the NSIS installer to %TEMP%\NEXUS-Update-Setup.exe (~85 MB). After the install runs, the downloaded .exe was LEFT BEHIND in %TEMP% — taking up disk space on every update cycle. Over a few months this could pile up to several GB. v4.10.0 fixes this in three places:

          - On startup: NEXUS silently sweeps %TEMP% for any NEXUS-Update-Setup.exe, nexus-update.part, NEXUS-Setup-*.exe, or NEXUS-Portable-*.exe files and deletes them. Best-effort, never blocks the launch.
          - Before every new download: cleanup runs again so the new download doesn't fight an old leftover of the same name.
          - Manual: Settings → General → Update Cache card shows the current cache size + file count + a one-click Clean button.

          **3. All 12 first-party plugins bumped to new minor versions.** Users who installed the v4.9.0 versions will now see 'Update available' badges on every installed plugin. New versions:

          - hello-world 1.2.0 → 1.3.0
          - library-insights 1.4.0 → 1.5.0
          - theme-studio 2.0.0 → 2.1.0
          - custom-dashboard 1.1.0 → 1.2.0
          - command-palette 2.0.0 → 2.1.0
          - backlog-manager 1.3.0 → 1.4.0
          - playtime-tracker 1.4.0 → 1.5.0
          - storage-manager 1.2.0 → 1.3.0
          - music-player 1.5.0 → 1.6.0
          - launch-profiles 1.1.0 → 1.2.0
          - game-info-hub 1.3.0 → 1.4.0
          - quick-access-overlay 1.2.0 → 1.3.0

          All existing functionality preserved: Lucide icons (no emojis), fixed Installed Plugins word-wrap layout, broadened HostAPI (topbar / status / commands / settings / dialogs / toasts / network / clipboard / system), per-plugin custom UI panels, 12 first-party plugins using the .plugin-* CSS design system + api.ui.icon(), library, collections, platform detection, launching, playtime tracking, achievements, overlay, Theme Studio, console/desktop mode, real platform logos, intelligent Get button, install detection, game trailers, sidebar collapse, settings tabs.

          **Downloads:**
          - NEXUS-Setup-4.10.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-4.10.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
