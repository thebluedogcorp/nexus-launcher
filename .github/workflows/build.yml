name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v3.9.0"
          $title = "NEXUS v3.9.0 — Removed the Store tab and all its related things"
          $notes = @"
          NEXUS — Universal Game Launcher for Windows.

          **v3.9.0 — Removed the Store tab and all its related things** (per user request).
          - Removed the entire NEXUS Store tab and the Downloads tab from the UI.
          - Removed the src/shared/store-catalog.ts file (the 56-game curated catalog).
          - Removed the src/main/downloads/ folder (the streaming download manager with pause/resume/cancel and NEXUSPKG magic-header payload generation).
          - Removed the src/renderer/components/StoreTab.tsx component (Hydra-style Catalogue page + Repacks modal + Downloads page + HeroDownloadView).
          - Removed the BottomPanel component (the persistent download-status footer at the bottom of the window).
          - Removed all store and downloads IPC handlers from src/main/ipc.ts (store:catalog, store:getGame, store:genres, store:sourceNames, store:pickInstallDir, downloads:start, downloads:pause, downloads:resume, downloads:cancel, downloads:remove, downloads:list, downloads:install, downloads:clearCompleted, downloads:openFolder).
          - Removed the legacy RAWG-backed store handlers that predated v3.7.0 (store:search, store:trending, store:topRated, store:newReleases).
          - Removed all store + downloads API methods from src/main/preload.ts and the DownloadEntry interface.
          - Removed the downloads state, the onDownloadProgress / onDownloadLibraryAdded listeners, and the Store + Downloads nav tabs from src/renderer/App.tsx.
          - Removed all the v3.7.0 and v3.8.0 store + downloads CSS from src/renderer/styles.css (~576 lines of CSS deleted).
          - KEPT the brighter color palette from v3.8.1 (the brightness fixes improved readability of the whole app, not just the store, so they stay).
          - The app is now back to just three nav tabs: Games · Achievements · Activity.
          - All other features are unchanged: scan/detect, library carousel, achievements, collections, activity, auto-updater, RAWG metadata patching for the existing library, settings page, stats dashboard.
          - Renderer bundle shrank from 438 KB JS / 83 KB CSS to 333 KB JS / 34 KB CSS (24 percent smaller JS, 59 percent smaller CSS) because all the store + downloads code is gone.

          Auto-detects every installed game across Steam, Epic, GOG, Battle.net, EA, Ubisoft, Riot and Xbox, patches rich metadata via the RAWG + Steam APIs, and launches games natively.

          **Downloads:**
                    - NEXUS-Setup-3.9.0.exe — NSIS installer (recommended, supports auto-update). Creates desktop + Start Menu shortcuts.
                    - NEXUS-Portable-3.9.0.exe — single-file portable build, no install required.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
