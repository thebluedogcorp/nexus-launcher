name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v6.5.0"
          $title = "NEXUS v6.5.0 — Settings panel, My List badge, Surprise/Settings shortcuts"
          $notes = @"
          NEXUS — Universal Game Launcher & Entertainment Hub for Windows.

          **v6.5.0 — Preferences + discoverability. A native settings panel, a live My List count badge, and two new keyboard shortcuts.**

          **New: NEXUS TV Settings panel (press `,` or click the gear icon).**
          A proper native-app settings modal with three sections:
          - **Playback**: toggle Hero auto-advance (8s rotation), Reduced motion (disable non-essential animations), NEW release badges.
          - **Your Library**: live stats — My List count, In Progress count, Recently Viewed count.
          - **Data**: a "Clear all NEXUS TV data" button that wipes My List + Continue Watching + History + preferences from this PC, with a confirmation toast.
          Each toggle fires a toast and persists instantly via a new `ent-prefs` store (localStorage).

          **New: My List count badge.**
          The My List sidebar button now shows a rose count badge (e.g. "3") when you have saved titles — so you always know at a glance. Updates live as you add/remove items.

          **New: keyboard shortcuts.**
          - **s** — Surprise Me (picks a random trending/TV title and starts playing immediately). Works from any view — navigates home first if needed, then fires.
          - **,** — open Settings.
          Both are documented in the Keyboard Shortcuts overlay (`?`), which now groups browse shortcuts under "Discover".

          **New stores.**
          `ent-prefs.ts` — `getPrefs()`, `setPrefs()`, `subscribePrefs()` for reactive preference access.

          All v6.4.0 functionality preserved: toast notifications, Surprise Me bar, command palette (Ctrl+K), hero manual arrows + Up Next, NEW badges, card sheen, hover preview popovers, Top 10 rail, arrow-key nav, scroll-to-top FAB, view transitions, keyboard shortcuts overlay, Recently Viewed rail, full CineSrc streaming playback, TMDB IPC in main process, mode switching, library, collections, platform detection, launching, playtime, achievements, overlay, console/desktop mode, themes, 4 first-party plugins.

          **Downloads:**
          - NEXUS-Setup-6.5.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-6.5.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
