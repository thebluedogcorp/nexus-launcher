name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v4.9.0"
          $title = "NEXUS v4.9.0 — Plugin system UI overhaul: Lucide icons, fixed Installed Plugins word-wrap, broadened HostAPI (topbar/status/commands/settings/dialogs/toasts/network/clipboard/system), per-plugin custom UI"
          $notes = @"
          NEXUS — Universal Game Launcher for Windows.

          **v4.9.0 — Plugin system UI overhaul + broadened HostAPI.**

          **1. Emojis replaced with Lucide icons.** Every first-party plugin (12 total) now references a Lucide icon by NAME ('music', 'rocket', 'palette', ...) instead of embedding emojis. New PluginIcon.tsx registry whitelists ~130 Lucide names; plugins call api.ui.icon('name', size) to get inline SVG for innerHTML composition. Sidebar items, topbar actions, status indicators, gallery cards, installed rows, dialog chrome — all use real icons from the icon library. No emojis anywhere.

          **2. Fixed the broken Installed Plugins layout.** The previous Installed Plugins row used flex with no word-break on the description and joined all permissions into one long string that overflowed horizontally. Now uses flex items-start + min-w-0 + flex-col body; descriptions have overflow-wrap:break-word, word-break:break-word, hyphens:auto, line-clamp:2. Each permission renders as its own chip that wraps naturally. Status badge is a colored pill (.status-enabled=accent, .status-error=danger, etc.). Settings + toggle + remove actions are 30x30 square buttons with Lucide icons.

          **3. Broadened HostAPI — 6 new UI surfaces + 3 new host services.** Plugins can now register their own custom UI in extraordinary ways:

          New UI surfaces:
          - ui:topbar — add buttons to the topbar (registerTopbarAction)
          - ui:statusbar — add live widgets to the topbar (registerStatusIndicator — renders into a small host-provided container)
          - ui:commands — register command palette entries (registerCommand) invokable via Ctrl+K
          - ui:settings — register a per-plugin settings panel (registerSettingsPanel) shown in Settings -> Plugins
          - ui:dialogs — open modal dialogs with custom bodies (openDialog with bodyHTML or bodyRender callback)
          - ui:toasts — show toast notifications via api.ui.toast({type,title,desc})

          New host services:
          - network.fetch(url, opts) — host-proxied HTTP(S) requests with 15s timeout + scheme validation (refuses file://, data:)
          - clipboard.readText / writeText — read + write the system clipboard
          - system.openExternal(url) + system.showItemInFolder(path) — open URLs in browser, reveal files in Explorer

          The plugin-runtime creates the HostAPI per-plugin, gates every method by manifest.permissions, and dispatches toast/dialog requests as window CustomEvents that App.tsx listens for + renders in React (consistent styling).

          **4. Per-plugin custom UI.** Plugins register pages with mount(container) + unmount(container). The host provides shared CSS classes (.plugin-page, .plugin-hero, .plugin-stat-grid, .plugin-stat, .plugin-card, .plugin-list, .plugin-list-item, .plugin-btn, .plugin-input, .plugin-tabs, .plugin-swatch, .plugin-now-playing) so plugins compose beautiful UI with classnames instead of inline styles. The SettingsPage PluginsTab now has a per-plugin settings button that expands the row to reveal the plugin's registered settings panel inline.

          **5. Redesigned PluginsTab in Settings.** Search box (with clear button) + category chips (Productivity/Library/Customization/Media/Utilities). Featured section using FeaturedPluginCard (larger card with featured strip, 44x44 icon tile, accent gradient header, name + tagline, Installed badge). Browse All section using PluginGalleryCard (240px min cards with 36x36 accent-tinted icon, 3-line description with proper word-break, permission chips, accent Install button). Installed Plugins section using InstalledPluginRow — the previously-broken layout, now fixed with proper flex + break-word + line-clamp + discrete permission chips + status pill + per-plugin settings expand.

          **6. 12 first-party plugins rewritten.** Every plugin's mount(c) function composes the new .plugin-* CSS design system + uses api.ui.icon('name', size) for inline SVG. Examples:
          - library-insights: 6-stat grid + Game of the Day card
          - theme-studio: 8-swatch palette + live --accent edit + registerSettingsPanel preset picker
          - command-palette: registers 4 commands via api.ui.registerCommand + opens a sample dialog with api.ui.openDialog
          - backlog-manager: tabbed status view + registerGameCardAction + 5 registerCommand calls
          - playtime-tracker: page + registerTopbarAction + registerStatusIndicator (live total in topbar)
          - storage-manager: largest installs + api.system.showItemInFolder to reveal in Explorer + status indicator
          - music-player: page + registerTopbarAction that opens a mini-player dialog + clipboard.writeText on 'Copy Track Info'
          - launch-profiles: storage-backed profiles + game-card action + clipboard.writeText
          - game-info-hub: search filter + api.network.fetch('https://httpbin.org/get?game=...') as a live network demo
          - quick-access-overlay: topbar action that opens a quick-access dialog with recent games + quick actions
          - hello-world: load-games button + toast on success
          - custom-dashboard: recently-played + favorites lists

          All existing functionality preserved: library, collections, platform detection, launching, playtime tracking, achievements, overlay, Theme Studio, console/desktop mode, real platform logos, intelligent Get button, install detection, game trailers, sidebar collapse, settings tabs.

          **Downloads:**
          - NEXUS-Setup-4.9.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-4.9.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
