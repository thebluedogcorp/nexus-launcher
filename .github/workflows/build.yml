name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v7.0.0"
          $title = "NEXUS v7.0.0 — Major UI overhaul: glitch fixes, immersive hero, keep-alive home, Because You Watched"
          $notes = @"
          NEXUS — Universal Game Launcher & Entertainment Hub for Windows.

          **v7.0.0 — A major UI overhaul. Fixed real glitches, maximized screen real estate, added a Ken Burns hero zoom, a keep-alive home (no refetch flash), and a "Because You Watched" smart rec rail.**

          **Bug fixes (real glitches the user reported):**
          - **Detail page poster was collapsed to 23px tall** — the aspect-ratio + height:auto in a CSS grid caused the poster to collapse to a sliver. Fixed with explicit width (152px) + height (228px) + align-self:start + display:block. Now renders at full 228px.
          - **Ambient backdrop covered the sidebar** — the position:fixed ambient layer with transform:scale(1.2) bled leftward over the 68px sidebar. Fixed by removing the transform (using background-size:120% instead) and scoping left:68px. Now stays within the body area.
          - **View-transition remount flash** — every navigation used key={view}, forcing a full remount + 6-endpoint TMDB refetch of the home screen every time you returned to it. Fixed with a keep-alive pattern: Home stays mounted (hidden via CSS) when inactive, retaining all its data. No more flash.
          - **Z-index conflicts** — the command palette, shortcuts overlay, and settings panel all shared z-index:300. Established a clear hierarchy: settings=200, shortcuts=210, palette=220, trailer=230.

          **Immersive screen real estate:**
          - Hero is now 72vh (was 62vh) — min 520px, max 820px. Taller, more cinematic.
          - Rails padding reduced 28px → 20px, page max-width widened 1480px → 1600px.
          - Landscape cards widened 300px → 320px for denser, richer rails.
          - Detail body max-width widened 1320px → 1480px.

          **New: Ken Burns hero zoom.**
          The active hero backdrop now slowly zooms from scale(1.05) to scale(1.14) over 18 seconds — a subtle, cinematic Ken Burns effect that makes the hero feel alive instead of static. Re-triggers on every hero rotation.

          **New: "Because You Watched" smart rec rail.**
          Home now shows a "Because you watched 'X'" rail that fetches TMDB recommendations for the most-recent item in your Recently Viewed history. Updates automatically as you visit new detail pages. Uses the existing tmdbRecommendations endpoint — no new API calls to maintain.

          **Cohesion:**
          - View transition is now a keep-alive swap (display:none/block) with a 6px rise-in, not a full remount.
          - All overlays use the established z-index hierarchy.

          All v6.7.0 functionality preserved: genre quick-bar, Copy Link, hero Watch Trailer modal, ambient detail backdrop, settings panel, My List badge, Surprise/Settings shortcuts, toast notifications, Surprise Me, command palette (Ctrl+K), hero manual arrows + Up Next, NEW badges, card sheen, hover preview popovers, Top 10 rail, arrow-key nav, scroll-to-top FAB, keyboard shortcuts overlay, Recently Viewed rail, full CineSrc streaming playback, TMDB IPC in main process, mode switching, library, collections, platform detection, launching, playtime, achievements, overlay, console/desktop mode, themes, 4 first-party plugins.

          **Downloads:**
          - NEXUS-Setup-7.0.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-7.0.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
