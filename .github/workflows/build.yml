name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v6.0.0"
          $title = "NEXUS v6.0.0 — Entertainment UI overhaul: full premium OTT design system for NEXUS TV"
          $notes = @"
          NEXUS — Universal Game Launcher & Entertainment Hub for Windows.

          **v6.0.0 — A top-to-bottom Entertainment UI overhaul. NEXUS TV is now a full premium OTT / native-Windows-app experience, not a website.**

          **What changed.**
          The entire NEXUS TV module was rebuilt around a dedicated design system with its own rose identity (--ent), a narrow icon sidebar, a floating glass clock, a cinematic hero, landscape rails, poster grids, a full detail page, and a full-screen player — all styled as a cohesive, production-quality native app.

          **New app shell (EntShell).**
          - Narrow 68px icon sidebar (Search / Home / Movies / TV / My List + Switch to Games / Mode selector at the bottom) with an animated rose active indicator bar.
          - Floating glass clock (top-right) with tabular-nums time + uppercase date — a native telemetry feel.
          - Keyboard shortcuts: press "/" anywhere to jump to Search, Esc to go back.
          - Sticky glass footer with brand + capability badges.

          **Cinematic hero (EntHero).**
          - Full-bleed crossfading backdrops (8s auto-advance), deep left-to-right gradient blend, huge condensed title, NEXUS TV kicker chip, rating + year + genre badges, 2-line synopsis, Watch Now / More Info / My List CTAs, and pagination dots.

          **Rails + cards (EntRails).**
          - Landscape 16:9 cards with type chip, hover scale + rose ring + play overlay, bottom gradient title/meta, and a Continue-Watching progress bar.
          - Portrait 2:3 poster cards with rating chip, type chip, in-list bookmark badge, hover lift + glow.
          - Rails with hover-reveal scroll arrows, snap scrolling, count badges, and shimmer skeletons.

          **Browse (EntBrowse).** Movies + TV pages with genre filter chips, paginated Show-More loading, responsive poster grid.

          **My List (EntMyList).** Continue Watching (landscape cards with resume + remove) and Saved Titles (poster grid), persisted locally via the ent-store.

          **Search (EntSearchView).** Big glass search bar with clear button, debounced multi-search across movies + TV, suggestion chips, and empty/no-results states.

          **Detail page (EntDetailPage).** Full-bleed backdrop hero with centered Play-Trailer ring, glass info panel overlapping the hero (poster + ratings + synopsis + genre pills + Watch Now / Trailer / My List / IMDb actions + resume bar), a stats column (director / status / runtime / episodes / starring), cast row with avatar circles, storyline, where-to-watch providers, and a More Like This recommendations rail.

          **Full-screen player (EntPlayer).** Glass top control bar (type badge + title + TV season/episode selector + position + open-in-browser + close), CineSrc iframe stage, Esc-to-close, and a local progress store so the app remembers where you left off across restarts.

          **Design tokens.** New --ent / --ent-rgb / --ent-hover / --ent-fg / --ent-soft rose tokens added to :root so the Entertainment identity is fully distinct from the Games (emerald) side and propagates everywhere live.

          All v5.1.0 functionality preserved: full CineSrc streaming playback, Games & Entertainment selector, TMDB IPC in main process, mode switching, library, collections, platform detection, launching, playtime, achievements, overlay, console/desktop mode, themes, 4 first-party plugins.

          **Downloads:**
          - NEXUS-Setup-6.0.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-6.0.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
