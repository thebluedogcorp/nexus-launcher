name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v5.0.0"
          $title = "NEXUS v5.0.0 — Games & Entertainment: new startup mode selector + NEXUS TV (OTT-style movie/TV browse powered by TMDB)"
          $notes = @"
          NEXUS — Universal Game Launcher & Entertainment Hub for Windows.

          **v5.0.0 — Games & Entertainment. A whole new mode.**

          NEXUS now opens with a full-screen **Games & Entertainment** selector. Pick how you want to spend your time:

          - **Games** — the game launcher you know: library, collections, playtime, achievements, stats, store, plugins, themes.
          - **Entertainment** — **NEXUS TV**: an OTT-style movie + TV browse experience powered by TMDB.

          **NEXUS TV (Entertainment mode):**
          - Cinematic hero banner cycling the week's trending titles (auto-advancing, with Play Trailer / More Info).
          - Six poster rails: Trending Now, Now Playing in Theaters, Popular Movies, Popular TV Series, Top Rated Movies, Top Rated TV Series.
          - Multi-search across movies + TV (debounced, filters out people + poster-less results).
          - Detail dialog: backdrop or click-to-play YouTube trailer, title + tagline, rating/year/runtime badges, overview, genres, top cast (profile photos), watch providers (stream/rent/buy via JustWatch), Homepage + IMDb deep links.
          - Hover-reveal poster cards with rating + media-type chips, scroll-arrow rails, skeleton loaders.

          **TMDB integration (security):**
          - All TMDB API calls run in the MAIN process (Node) via new IPC channels (tmdb:trendingAll / popular / topRated / nowPlaying / popularTv / topRatedTv / byGenre / search / searchMulti / details / detailsTv / detailsAny). The renderer never contacts api.themoviedb.org, so the CSP connect-src stays locked down.
          - TMDB images load under the existing https: img-src; trailers embed under the existing YouTube frame-src (youtube-nocookie.com). No CSP changes needed.
          - 12s upstream timeout, error-envelope wrapping, normalized movie + TV item shapes, unified details dispatcher.

          **Mode switching:**
          - The NEXUS logo in the games topbar is now clickable — returns to the selector.
          - A new TV pill button in the games topbar jumps straight to NEXUS TV.
          - NEXUS TV has a back arrow + a Games button + a Switch-mode link in the hero.
          - The selector always shows on app open (mode is runtime state, not persisted) — no lock-in.

          **Files added:**
          - src/main/tmdb.ts — TMDB service (movie + TV endpoints, unified details, watch providers, trailer-key picker).
          - src/renderer/components/ModeSplash.tsx — startup selector with cinematic trending collage.
          - src/renderer/components/entertainment/EntertainmentView.tsx + EntHero.tsx + EntCarousel.tsx + EntDetailDialog.tsx.
          - src/renderer/lib/tmdb-types.ts — renderer types + image/rating/runtime helpers.
          - ~380 lines of CSS (splash + NEXUS TV design system, scoped rose accent for entertainment identity).

          All v4.11.0 functionality preserved: 4 first-party plugins, plugin auto-update, installer cache cleanup, library, collections, platform detection, launching, playtime tracking, achievements, overlay, console/desktop mode, themes.

          **Downloads:**
          - NEXUS-Setup-5.0.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-5.0.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
