name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v4.10.1"
          $title = "NEXUS v4.10.1 — CRITICAL FIX: Settings → Plugins tab crash (bad JSON escape in 4 plugin descriptions)"
          $notes = @"
          NEXUS — Universal Game Launcher for Windows.

          **v4.10.1 — Critical fix for the Settings → Plugins tab crash.**

          **The bug:** Opening Settings and clicking the Plugins tab caused the app to go completely black. The root cause was 4 plugin descriptions in first-party-plugins.ts that contained the escape sequence backslash-backslash-apostrophe (literally 'host\\'s', 'haven\\'t', 'here\\'s', 'you\\'ve', 'game\\'s'). When TypeScript compiled the template literal to a JavaScript string, the double backslash became a single backslash — so the resulting JSON manifest string contained backslash-apostrophe, which is NOT a valid JSON escape sequence. JSON.parse threw 'Bad escaped character in JSON' inside the PluginsTab's useMemo, which crashed the React tree — SettingsPage unmounted, leaving only the dimming overlay (black screen).

          The bug was present in v4.9.0 (when the 12 first-party plugins were first rewritten with the .plugin-* design system) and v4.10.0. Users on either version would see the Plugins tab crash.

          **The fix:** Replaced every backslash-backslash-apostrophe in the 4 affected plugin strings with a typographic right single quote (U+2019, the curly apostrophe). This is JSON-safe (it's a regular character), HTML-safe (renders as a typographic apostrophe), and visually nicer than a straight quote. The 4 fixed strings:

          - command-palette manifest description: 'Registers commands for the host's command palette...' (was 'host\\'s')
          - library-insights page mount(): 'A title you haven't played recently...' (was 'haven\\'t')
          - custom-dashboard page mount(): 'Welcome back — here's what you've been playing.' (was 'here\\'s' + 'you\\'ve')
          - launch-profiles page mount(): 'Swap profiles from a game's context menu.' (was 'game\\'s')

          All v4.10.0 functionality is preserved: plugin auto-update system (catalog comparison, 'Update available' badges, 'Check for updates' button, per-row Update action button), installer cache cleanup (auto-sweep on startup + before every download + manual Clean button in Settings → General → Update Cache), all 12 first-party plugins bumped to new minor versions, Lucide icons everywhere (no emojis), broadened HostAPI (topbar/status/commands/settings/dialogs/toasts/network/clipboard/system), per-plugin custom UI panels.

          Verification: TypeScript zero errors on both Electron tsconfigs. Vite production build succeeded. Reproduced the original crash in a mock-test harness (loaded the built JS in Chromium with a stubbed window.nexus — Settings overlay had 0 children, console.error showed 'SyntaxError: Bad escaped character in JSON at position 151 (line 6 column 51)'). After the fix, the same mock test renders the Plugins tab cleanly: 12 plugin cards + search box + 13 Install buttons + Installed Plugins section + no errors.

          **Downloads:**
          - NEXUS-Setup-4.10.1.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-4.10.1.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
