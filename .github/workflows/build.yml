name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v7.2.0"
          $title = "NEXUS v7.2.0 — 20+ major features: Stats, Collections, Discover, ratings, reviews, bug fixes"
          $notes = @"
          NEXUS — Universal Game Launcher & Entertainment Hub for Windows.

          **v7.2.0 — Massive feature expansion + critical bug fixes. 20+ major new features across the Entertainment tab, a fixed trailer player, a fixed info-panel overlap, and a single search button.**

          **Bug fixes (user-reported):**
          - **YouTube trailer "Video Player Configuration Error"** — switched from youtube-nocookie.com (which fails for many videos) to youtube.com/embed with color=white + proper referrer policy. Trailers now play reliably.
          - **Info panel overlapped the poster** — the tabbed panel had margin-top:-40px (pulled up over the hero). Changed to +24px so it sits cleanly below the action bar.
          - **Two search buttons** — removed the duplicate command-palette trigger from the sidebar. Now there's exactly one Search nav button (Ctrl+K still opens the palette).

          **20+ major new features:**

          *New views (3):*
          1. **Statistics Dashboard** — watch streak (current + longest), 6 stat cards (My List / In Progress / Recently Viewed / Rated / Reviews / Collections), average rating, rated-titles chips.
          2. **Collections** — user-created playlists of titles. Create, browse, add/remove titles from any detail page, delete collections. Poster-stack thumbnails on collection cards.
          3. **Discover** — curated discovery page with Daily Pick (deterministic per day), mood-based recommendations (Thrilling / Heartwarming / Mind-bending / Epic / Dark), and a Discovery Shuffle rail.

          *Detail page additions (5):*
          4. **User star rating** — 10-star rating widget in the action bar; click any star to rate 1-10, click again to clear. Persists locally + fires a toast.
          5. **My Review tab** — a 5th tab with a textarea for personal notes/reviews per title. Save/delete, persisted locally.
          6. **Add to Collection dropdown** — on every detail page, add the current title to any existing collection via a dropdown.
          7. **Homepage link** — external link to the title's official homepage (if TMDB has one).
          8. **Deeper Facts tab** — 11 metadata fields including IMDb ID, top cast, all genres.

          *New stores (4):*
          9. **User ratings store** — getRating/setRating/getAllRatings (1-10 per title).
          10. **Reviews store** — getReview/setReview/deleteReview/getAllReviews.
          11. **Collections store** — getCollections/createCollection/deleteCollection/addToCollection/removeFromCollection.
          12. **Watch streak store** — getStreak/recordWatchDay (tracks consecutive days with watch activity).

          *Home + cross-cutting (8+):*
          13. **Watch streak tracking** — every time you press Watch, the streak increments (consecutive days).
          14. **Discover sidebar nav** — new Discover button in the sidebar.
          15. **Collections sidebar nav** — new Collections button.
          16. **Statistics sidebar nav** — new Statistics button.
          17. **Command palette expanded** — 10 quick actions (was 7) including Discover, Collections, Statistics.
          18. **Keep-alive home** retained — no refetch flash when returning home.
          19. **Ken Burns hero zoom** retained — cinematic slow zoom.
          20. **Because You Watched rail** retained — smart recs from history.

          *Theme + cohesion:*
          - Sleeker dark theme: deeper black backgrounds (#050507), darker sidebar gradient, darker glass panels.
          - Bolder rail titles (800 weight, tighter tracking) + page titles (900 weight).
          - All new views use the unified ent-page shell + page-head pattern for consistency.

          All v7.1.0 functionality preserved: redesigned detail page, tabbed panel, rating ring, action bar, ambient backdrop, settings panel, My List badge, Surprise/Settings shortcuts, toast notifications, Surprise Me, command palette (Ctrl+K), hero manual arrows + Up Next, NEW badges, card sheen, hover preview popovers, Top 10 rail, arrow-key nav, scroll-to-top FAB, keyboard shortcuts overlay, Recently Viewed rail, full CineSrc streaming playback, TMDB IPC in main process, mode switching, library, collections, platform detection, launching, playtime, achievements, overlay, console/desktop mode, themes, 4 first-party plugins.

          **Downloads:**
          - NEXUS-Setup-7.2.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-7.2.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
