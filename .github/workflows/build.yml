name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v9.0.0"
          $title = "NEXUS v9.0.0 — OTT Premium Redesign: billboard hero, Anime, New & Popular, Account + Downloads"
          $notes = @"
          NEXUS — Universal Game Launcher & Entertainment Hub for Windows.

          **v9.0.0 — The OTT Premium Redesign. A world-class streaming-platform look and major new sections, inspired by the best of Netflix, Disney+, Prime Video and Apple TV+.**

          **New: Netflix-style billboard hero.**
          A completely redesigned featured hero: bold "N SERIES / N FILM" tag, huge cinematic title, green match percentage, maturity badge, HD tag, white Play + translucent More Info buttons (Netflix pattern), circular My List / Trailer actions, a maturity-rating strip on the right edge, and Ken Burns crossfading artwork with deep gradient blends.

          **New: Anime hub (press a).**
          A dedicated anime tab — Popular Anime Series, All-Time Anime Greats (numbered top-10 row), and Anime Movies (Japanese animation via TMDB), plus a mood strip of anime vibes.

          **New: New & Popular hub (press p).**
          Everything fresh in one place: Trending Now, New Releases, Top 10 Movies and Top 10 Series Today, and Worth the Wait — Coming Soon.

          **New: Account & Downloads (press u).**
          An Account section with an editable profile (avatar, member-since) and 8 library stat cards — plus a full downloads manager: an adjustable download location (native Windows folder picker), Auto Download (automatically saves the next episode offline when one finishes), Smart Download (deletes watched episodes to free space), Standard/High/Max quality preference, storage usage, and a downloads list with remove controls. Download buttons appear on detail pages and in the player. Offline packages are real files written to your chosen folder (title info, artwork link, your rating/review/progress).

          **New: Grouped sidebar + expanded home.**
          The sidebar is now organized into Browse / Hubs / Library / Account groups. The home screen grew to 12 rails — Top 10 Series, Anime Spotlight, Coming Soon, Action & Adventure and Comedies joined the lineup, with staggered loading so the first paint stays instant.

          All v8.x functionality preserved: series Episodes tab, enhanced search with filters and people results, notifications center, watched tracking, autoplay next episode, expanded settings, and every prior feature.

          **Downloads:**
          - NEXUS-Setup-9.0.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-9.0.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
