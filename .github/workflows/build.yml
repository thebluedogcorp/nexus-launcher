name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v9.3.0"
          $title = "NEXUS v9.3.0 — Local Media Server: stream your own files"
          $notes = @"
          NEXUS — Universal Game Launcher & Entertainment Hub for Windows.

          **v9.3.0 — Local Media Server. Stream your own files.**

          A built-in media server now serves the video files already on your machine. Configure your folders in Settings → Media Server, scan, and play — movies, shows, clips, anything you own. Files stream through a custom nexus-media:// protocol with full HTTP Range support, so seeking works natively in the in-app HTML5 player. MP4 / WebM / MOV play in-browser; MKV / AVI / others show their file path for a system player.

          **LAN sharing.** A QR code + access-code panel lets other devices on your network browse and stream your library. The host PC must stay running; it is LAN-only and nothing is uploaded — your files, your network.

          **Still clean — no piracy.**
          Entertainment remains browse-only (TMDB metadata + YouTube trailers). No third-party stream hosts are embedded or routed. The media server only ever serves files from your own configured folders.

          **Game launcher fully preserved.**
          Auto-detection across Steam, Epic, GOG, Battle.net, EA, Ubisoft, Riot and Xbox. RAWG metadata. Library, favorites, playtime tracking, plugins, command palette, and the in-app auto-updater all work as before.

          **Downloads:**
          - NEXUS-Setup-9.3.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-9.3.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
