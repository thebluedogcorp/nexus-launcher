name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v4.5.1"
          $title = "NEXUS v4.5.1 — Download-source management UI: add/edit/remove/import/export direct HTTP(S) sources"
          $notes = @"
          NEXUS — Universal Game Launcher for Windows.

          **v4.5.1 — Download-source management UI (the missing piece from v4.5.0).**

          v4.5.0 shipped the download engine + adapter backend but no UI to actually add sources. This release adds a full Settings -> Downloads tab:

          **1. Direct Download Sources** — add, edit, and remove user HTTP(S) sources. Each entry is a direct-download URL you are authorized to use (free games, your own hosted files, official direct downloads). These appear as "Download" options in the Get-game picker for every game in your library. An Add/Edit modal validates the URL (http/https only) and captures a name + optional note.

          **2. Import / Export JSON** — export your source list to an open-schema JSON file, or import one. The schema is documented inline:
          {
            "schema": "nexus-sources/v1",
            "sources": [ { "id": "...", "name": "...", "url": "https://...", "note": "..." } ]
          }
          Import accepts either {sources:[...]} or a bare array, validates each entry, and dedupes by URL.

          **3. Source JSON format + Hydra compatibility note** — a clear in-app explanation that only http(s) direct-download URLs are accepted (no magnets/torrents), and that Hydra Launcher's source files (which contain unauthorized commercial-game repack/torrent links) are not supported. The NEXUS format is the legitimate equivalent — an open schema for any authorized direct-download URL.

          All v4.5.0 functionality preserved: availability-aware actions (Get/Play), the open-source catalog (10 real free games), official store links, the download manager (Range resume, pause/cancel/retry, sha256 verification, persistent jobs), the Downloads panel, and the security model (http(s)-only, path-traversal-safe, never auto-execute).

          **Downloads:**
          - NEXUS-Setup-4.5.1.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-4.5.1.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
