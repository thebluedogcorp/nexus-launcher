name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v8.0.0"
          $title = "NEXUS v8.0.0 — OTT Completeness: episodes, enhanced search, notifications, watched tracking"
          $notes = @"
          NEXUS — Universal Game Launcher & Entertainment Hub for Windows.

          **v8.0.0 — The OTT Completeness Update. Brings NEXUS TV to the standard of leading global streaming platforms.**

          **New: Series Episodes tab.**
          Every TV detail page now has an Episodes tab with a season selector and a full episode list — each episode shows a still thumbnail, title, overview, runtime, air date, rating, a one-click Play button, and a per-episode watched check. A season progress counter shows how many episodes you've watched. The default tab for TV titles is now Episodes.

          **New: Enhanced universal search.**
          A filter panel (toggle with the sliders icon) with media type (All / Movies / TV), genre multi-select, year range (from / to), minimum rating, and sort order (Relevance / Popularity / Rating / Newest / A→Z). Instant suggestions dropdown appears as you type. Search history with clear controls is shown when idle. A People row surfaces cast and crew results with their known-for titles.

          **New: In-app Notifications center.**
          A bell in the sidebar (press b) opens a notifications panel with an unread badge. It auto-seeds new-episode alerts for saved and unfinished TV titles, plus watch-streak milestones. Quiet hours are respected (configurable in Settings).

          **New: Mark Watched + Hide from Recommendations.**
          Every detail page has Mark Watched / Unwatched and Hide / Show buttons. Watched titles get a check overlay; hidden titles are filtered out of recommendations.

          **New: Autoplay next episode.**
          The player automatically advances to the next episode when one finishes (estimated from wall-clock progress). Toggle in Settings → Playback.

          **New: Expanded Settings.**
          Playback section adds autoplay-next, data saver (smaller image sizes), and watched-badges toggles. A new Parental Controls section lets you filter by content rating (Off / PG / PG-13 / R). A new Notifications section controls in-app notifications and quiet-hours window.

          All v7.x functionality preserved: What's New panel, filmic grain, Statistics Dashboard, Collections, Discover, user ratings, reviews, tabbed detail panel, redesigned detail page, keep-alive home, Ken Burns hero, Because You Watched rail, full CineSrc streaming playback, command palette, keyboard shortcuts, Top 10 rail, hover previews, and every prior feature.

          **Downloads:**
          - NEXUS-Setup-8.0.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-8.0.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
