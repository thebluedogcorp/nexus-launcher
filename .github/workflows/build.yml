name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v6.2.0"
          $title = "NEXUS v6.2.0 — Command palette (Ctrl+K), hero manual controls, NEW badges, premium polish"
          $notes = @"
          NEXUS — Universal Game Launcher & Entertainment Hub for Windows.

          **v6.2.0 — Power-user UX for NEXUS TV. A command palette, manual hero controls, release badges, and tactile micro-polish that make the app feel like a top-tier native product.**

          **New: Command Palette (Ctrl/Cmd+K).**
          A native-app command palette opens anywhere with Ctrl+K (or click the search icon at the top of the sidebar). Fuzzy-search across cached trending titles + your My List, with quick-action shortcuts to every view (Home / Movies / TV / My List / Search / Switch to Games / Mode selector). Fully keyboard-driven: ↑↓ navigate, ↵ activates, Esc closes. The sidebar trigger pulses with a rose dot so it's discoverable. Title hits show poster thumbnails + type tags.

          **New: Manual hero prev/next arrows.**
          The cinematic hero now has prev/next arrows on the left/right edges (reveal on hover) so you can flip between featured titles directly instead of waiting for the 8s auto-advance. An "Up Next" glass chip in the bottom-right previews the next title. Pagination dots still work.

          **New: NEW badge on recent releases.**
          Poster cards for titles released within the last ~18 months get a green "NEW" pill in the top-left corner — so fresh content stands out at a glance in browse/search/my-list grids.

          **New: card hover sheen sweep.**
          Both landscape and poster cards now get a subtle diagonal light-sheen that sweeps across the art on hover — a small but premium tactile detail.

          **Polish.**
          - Sidebar active indicator bar now pulses with a rose glow (2.2s breathe).
          - Focus-visible rings on ALL interactive elements (CTAs, chips, dots, arrows, load-more, clear) — full keyboard accessibility.
          - Hero text block slides in on every rotation.
          - Command palette has a proper backdrop blur + scale-in animation.
          - New `isNewRelease()` helper exported from tmdb-types.

          All v6.1.0 functionality preserved: hover preview popovers, Top 10 rail, arrow-key card navigation, scroll-to-top FAB, view transitions, full CineSrc streaming playback, TMDB IPC in main process, mode switching, library, collections, platform detection, launching, playtime, achievements, overlay, console/desktop mode, themes, 4 first-party plugins.

          **Downloads:**
          - NEXUS-Setup-6.2.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-6.2.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
