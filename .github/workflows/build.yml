name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v5.1.0"
          $title = "NEXUS v5.1.0 — Full streaming playback (CineSrc) + fixed desktop-mode mode switching"
          $notes = @"
          NEXUS — Universal Game Launcher & Entertainment Hub for Windows.

          **v5.1.0 — Watch full movies & TV shows inside NEXUS TV, plus desktop-mode mode-switch fix.**

          **New: full streaming playback via CineSrc.**
          NEXUS TV can now play full movies and TV episodes — not just trailers. Click **Watch Now** on the hero or in any detail dialog and a full-screen player opens, embedding the CineSrc stream for that title.

          - **CineSrc** (cinesrc.st) is a free streaming API that indexes embeddable streams against TMDB IDs. Since NEXUS TV already uses TMDB IDs, playback is a direct embed — no scraping, no file hosting, no extra lookups.
          - **Movie URL**: cinesrc.st/embed/movie/{tmdbId}
          - **TV URL**: cinesrc.st/embed/tv/{tmdbId}?season={s}&episode={e}
          - The embed pages return 200 with no X-Frame-Options, so they iframe cleanly inside the app.
          - CSP frame-src extended to allow https://cinesrc.st (+ wildcard). connect-src stays locked — all TMDB API calls still go via main-process IPC.

          **Full-screen player (EntPlayer):**
          - Top bar: title, media-type badge, and for TV a **season + episode selector** (season dropdown populated from TMDB number_of_seasons; episode input; prev/next buttons). Changing the selector re-targets the iframe live without re-mounting the overlay.
          - Open-in-browser link, close button, Esc-to-close.
          - Footer disclaimer: NEXUS does not host or store any video — streams are indexed by CineSrc against TMDB IDs.

          **Detail dialog:**
          - New primary **Watch Now** button (opens the player) alongside **Play Trailer** (YouTube) and Watchlist/Homepage/IMDb links.
          - TMDB TV details now carry numberOfSeasons + numberOfEpisodes so the player's season dropdown is accurate.

          **Hero:**
          - Netflix-style: **Watch Now** (primary, opens player) + **More Info** (opens detail dialog).

          **Bug fix — desktop-mode mode switching:**
          - The clickable NEXUS logo + TV pill button were missing from the **desktop** UI-mode topbar (only the console/PS5 topbar had them). Once you switched to Entertainment from desktop mode there was no way back to Games from the games topbar in desktop layout. v5.1.0 adds the clickable logo + TV pill to the desktop topbar too, so mode switching works identically in both layouts.

          **Polish:**
          - Splash Entertainment card copy updated to advertise full streaming.
          - NEXUS TV footer reflects full streaming + trailer playback.
          - Player, hero, and detail-dialog button styling refined (Watch Now glow, consistent badges).

          All v5.0.0 functionality preserved: Games & Entertainment selector, NEXUS TV browse (hero + 6 carousels + multi-search + detail dialog), TMDB IPC in main process, mode switching, library, collections, platform detection, launching, playtime, achievements, overlay, console/desktop mode, themes, 4 first-party plugins.

          **Downloads:**
          - NEXUS-Setup-5.1.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-5.1.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
