name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v3.1.0"
          $title = "NEXUS v3.1.0 — PS5 look, fixed and polished"
          $notes = @"
          NEXUS — Universal Game Launcher for Windows.

          **v3.1.0 — PS5 look, fixed and polished:**
          - **FIXED tile clipping.** The focused tile no longer gets cut off — carousel now uses overflow-y: visible with extra vertical padding so the scaled tile shows fully.
          - **FIXED gradient hiding elements.** Reduced the bottom gradient darkness from 92% to 70% so the bottom info zone stays readable.
          - **REAL portrait posters.** Steam's library_600x900 portrait capsule is now used as the cover image (true poster art), with the wide header_image as the banner background.
          - **Deep Filesystem Scan.** New scan mode that walks every fixed drive (C:\, D:\, etc.) + custom paths to detect games installed in non-default locations. Uses heuristics: large .exe + game data files (.pak, .uasset, .bsa, data.win, etc.) or directories larger than 2GB. Detects games the platform scanners miss.
          - **New filter row.** Sort dropdown (Recently Played / Name A-Z / Most Played / Top Rated) + All/Favorites/platform quick-filter pills with live counts.
          - Larger tiles (150px), smoother focus transitions, refined PS5 depth effect.

          Auto-detects every installed game across Steam, Epic, GOG, Battle.net, EA, Ubisoft, Riot and Xbox, patches rich metadata via the RAWG + Steam APIs, and launches games natively.

          **Downloads:**
          - \`NEXUS-Setup-1.8.0.exe\` — NSIS installer (recommended, supports auto-update). Creates desktop + Start Menu shortcuts.
          - \`NEXUS-Portable-1.8.0.exe\` — single-file portable build, no install required.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
