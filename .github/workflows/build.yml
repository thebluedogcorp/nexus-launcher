name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v4.4.1"
          $title = "NEXUS v4.4.1 — Critical fix: 'Cannot find module @shared/theme-types' crash on startup (v4.4.0 hotfix)"
          $notes = @"
          NEXUS — Universal Game Launcher for Windows.

          **v4.4.1 — Critical hotfix for v4.4.0.**

          **The bug:** v4.4.0 introduced the Theme Studio, whose main-process DB layer imported DEFAULT_THEME and PRESET_THEMES from '@shared/theme-types' / '@shared/theme-presets' using the TypeScript path alias. The main process is compiled to CommonJS, and while tsc resolves the alias at TYPE-CHECK time, it does NOT rewrite it in the emitted JavaScript — so the packaged db.js contained 'require("@shared/theme-types")' verbatim. Node's CommonJS runtime resolver does not understand the @shared/* alias, so on startup the main process threw 'Error: Cannot find module @shared/theme-types' and the app never opened. (The existing '@shared/types' imports were 'import type' — erased at emit — so they never tripped this; only the new VALUE imports did.)

          **The fix:** changed the two value imports in src/main/db.ts to relative paths ('../shared/theme-types' and '../shared/theme-presets') so Node resolves them at runtime. Verified: the emitted dist-electron/main/db.js now contains 'require("../shared/theme-types")' and zero 'require("@shared/...') calls remain anywhere in the main process. The renderer (bundled by Vite, which resolves the alias at build time) was always fine.

          All v4.4.0 Theme Studio functionality is preserved — this is purely the startup-crash fix. If you installed v4.4.0 and it would not open, install v4.4.1 over it; your library, collections, and any saved themes are unaffected.

          **Downloads:**
          - NEXUS-Setup-4.4.1.exe — NSIS installer (recommended, supports auto-update; if you had v4.4.0 installed, this updater will also fix the crash).
          - NEXUS-Portable-4.4.1.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
