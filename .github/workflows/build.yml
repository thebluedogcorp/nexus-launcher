name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v9.1.1"
          $title = "NEXUS v9.1.1 — Hindi Dub honesty fix: verified-playback via CineSrc, fake audio switch removed"
          $notes = @"
          NEXUS — Universal Game Launcher & Entertainment Hub for Windows.

          **v9.1.1 — Hindi Dub honesty fix. Clicking Hindi no longer errors; playback routes through the one source verified to actually play.**

          **Fix: the CSP error on Hindi is gone.**
          v9.1.0 routed Hindi to 2Embed, which the app's Content-Security-Policy blocked (ERR_BLOCKED_BY_CSP). That route is removed.

          **Verified via network tracking: CineSrc is the only source that genuinely plays.**
          CineSrc bootstraps a real HLS player (loads .m3u8 + init.mp4 + segments — 42 requests). 2Embed and VidSrc embeds return HTTP 200 but load only their document shell and make ZERO video requests — they do not play in an iframe. v9.1.0's verification (HTTP 200 + param echoed) was insufficient; this build verifies actual playback.

          **Honest redesign.**
          Removed the fake EN / हिं audio toggle that pretended to switch audio tracks (impossible cross-origin). All playback now uses CineSrc (verified-working, CSP-allowed). The stream-source selector remains: CineSrc (recommended) + 2Embed / VidSrc labeled experimental.

          **Hindi Dub hub is the genuine Hindi delivery.**
          Hindi-origin titles (Bollywood + Hindi cinema) play with Hindi audio automatically via CineSrc (India-focused). For Hollywood dubbed in Hindi, the player shows a one-time guide toast to pick a Hindi server in CineSrc's in-player Settings (gear) menu — verified there is no URL param to force Hindi (embed HTML is identical with/without ?lang=hi).

          All v9.0.0 / v9.1.0 functionality preserved: Hindi Dub hub (press h), billboard hero, Anime + New & Popular hubs, Account with downloads, episodes tab, enhanced search, notifications, watched tracking, autoplay next episode, expanded settings.

          **Downloads:**
          - NEXUS-Setup-9.1.1.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-9.1.1.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
