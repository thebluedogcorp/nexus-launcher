name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v4.11.0"
          $title = "NEXUS v4.11.0 — Removed 8 redundant first-party plugins that duplicated native features + polished UIs for the 4 remaining"
          $notes = @"
          NEXUS — Universal Game Launcher for Windows.

          **v4.11.0 — Removed 8 redundant first-party plugins + polished the 4 remaining.**

          **Why the removals:** v4.9.0/v4.10.0 shipped 12 first-party plugins, but 8 of them duplicated features already available natively in the app. Shipping redundant plugins is illogical — they bloat the install, confuse users about what the app already does, and waste maintainer effort. v4.11.0 keeps only the 4 plugins that genuinely extend the app with NEW capabilities.

          **Removed (8 plugins — duplicates of native features):**
          - theme-studio — duplicates the native ThemeStudio component (topbar Theme Studio button)
          - custom-dashboard — duplicates the native Library home view (carousel + grid)
          - game-info-hub — duplicates the native GamePage + GameEditor
          - library-insights — duplicates the native StatsDashboard (topbar Stats button — shows top played, largest games, totals)
          - playtime-tracker — duplicates native playtime tracking + StatsDashboard already shows top played
          - storage-manager — duplicates StatsDashboard largest-games list + GamePage already has Reveal-in-Explorer
          - launch-profiles — duplicates the native GameEditor which edits launchCommand/executable/installDir per-game
          - quick-access-overlay — duplicates the native sidebar (All Games / Favorites / Recently Played / Top Rated / Platforms / Shortcuts)

          **Kept (4 plugins — genuinely extend the app):**
          - hello-world 2.0.0 — minimal starter plugin for plugin developers (educational; not a feature duplicate)
          - command-palette 2.2.0 — Ctrl+K command palette (the app has no native command palette)
          - backlog-manager 2.0.0 — game-status tracking (Want/Playing/Paused/Completed/Abandoned — the app has no native status tracking)
          - music-player 2.0.0 — floating mini-player (the app has no native music player)

          **UI polish on the 4 remaining plugins:**
          - hello-world: redesigned hero with quick-reference card listing what the plugin demonstrates (registerPage / api.games.list() / api.ui.toast()), loading state with spinner, empty state with icon + call-to-action, per-game platform + developer tags.
          - command-palette: in-plugin command search filter with clear button, keyboard shortcut chips next to each command (Ctrl+R / Ctrl+F), Recently Played dialog now opens with last-played timestamps, no-results empty state.
          - backlog-manager: tabbed board with per-status game counts in each tab, clear empty state per status with call-to-action ('Right-click a game in your library and select Set Backlog Status'), per-game platform + developer sub-line, Clear button per game.
          - music-player: rotating album art (CSS spin animation when playing), progress bar with seek handle + current/total times, queue list with active-track highlight + click-to-select, topbar action opens a 380px mini-player dialog with Copy Track Info action (uses the clipboard API).

          **New CSS classes** added to styles.css for the polished UIs:
          - @keyframes spin (for the rotating album art)
          - .plugin-empty-sub (secondary line in empty states)
          - .np-progress-row / .np-progress / .np-progress-fill / .np-time (music player progress bar)
          - .plugin-list-item.active (active queue item highlight)
          - .plugin-page kbd / code / strong (keyboard hints + inline code + bold text inside plugin pages)
          - .plugin-card .plugin-search-box (smaller variant for in-card search)
          - .plugin-list-text-stack / .plugin-list-sub / .plugin-list-rank (for richer list items)

          All v4.10.0/v4.10.1 functionality preserved: plugin auto-update system, installer cache cleanup, Lucide icons (no emojis), broadened HostAPI (topbar/status/commands/settings/dialogs/toasts/network/clipboard/system), per-plugin custom UI panels, library, collections, platform detection, launching, playtime tracking, achievements, overlay, console/desktop mode, real platform logos, intelligent Get button, install detection, game trailers, sidebar collapse, settings tabs.

          **Downloads:**
          - NEXUS-Setup-4.11.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-4.11.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
