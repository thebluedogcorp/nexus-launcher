name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v6.6.0"
          $title = "NEXUS v6.6.0 — Hero Watch Trailer modal, ambient detail backdrop, polish"
          $notes = @"
          NEXUS — Universal Game Launcher & Entertainment Hub for Windows.

          **v6.6.0 — Cinematic polish. A hero Watch Trailer button + YouTube modal, and an ambient blurred backdrop on the detail page.**

          **New: Watch Trailer button on the hero.**
          The cinematic hero now has a dedicated "Watch Trailer" CTA (between Watch Now and More Info). Clicking it opens a full trailer modal that fetches the YouTube trailer key on-demand via tmdbDetailsAny — so you can preview any featured title without leaving the home screen. The modal has a backdrop blur, scale-in animation, loading + error states, and Esc/click-outside to close.

          **New: EntTrailerModal component.**
          A reusable YouTube trailer modal (EntTrailerModal.tsx) — fetches the trailer key via tmdbDetailsAny, embeds youtube-nocookie.com with autoplay, shows a spinner while loading and a graceful "No trailer available" message if TMDB has none. Esc closes (capture-phase).

          **New: Ambient blurred backdrop on the detail page.**
          The detail page now has a full-viewport blurred, saturated, dimmed copy of the backdrop image behind everything — giving every detail page a cinematic ambient glow that matches the title's color palette. The glass info panel uses a deeper background (86% opacity) so text stays readable against the ambient layer.

          **Polish.**
          - Hero "Watch Trailer" button gets a subtle rose-tinted accent (border + bg) so it stands out from the other ghost buttons.
          - Trailer modal has proper backdrop blur + scale-in animation.
          - Detail-page glass panel deepened to 86% opacity for ambient contrast.
          - Full responsive: trailer modal fills the viewport on narrow screens.

          All v6.5.0 functionality preserved: settings panel, My List badge, Surprise/Settings shortcuts, toast notifications, Surprise Me bar, command palette (Ctrl+K), hero manual arrows + Up Next, NEW badges, card sheen, hover preview popovers, Top 10 rail, arrow-key nav, scroll-to-top FAB, view transitions, keyboard shortcuts overlay, Recently Viewed rail, full CineSrc streaming playback, TMDB IPC in main process, mode switching, library, collections, platform detection, launching, playtime, achievements, overlay, console/desktop mode, themes, 4 first-party plugins.

          **Downloads:**
          - NEXUS-Setup-6.6.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-6.6.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
