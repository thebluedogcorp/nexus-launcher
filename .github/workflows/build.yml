name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v7.3.0"
          $title = "NEXUS v7.3.0 — What's New panel, filmic grain, autonomous update pipeline"
          $notes = @"
          NEXUS — Universal Game Launcher & Entertainment Hub for Windows.

          **v7.3.0 — See every update inside the app. A What's New changelog panel, a filmic grain overlay, and an autonomous update pipeline.**

          **New: What's New panel (press `n`).**
          A changelog modal that shows every version's changes with the latest featured in a highlighted card (version number, kind badge Major/Feature/Polish, date, and check-marked item list). Historical versions appear as compact entries with expand-to-full. Opened via the new sparkle button at the bottom of the sidebar (with a pulsing rose notification dot) or the `n` keyboard shortcut. This makes the autonomous update pipeline visible — every scheduled update that ships will appear here.

          **New: Filmic grain + vignette overlay.**
          The entire Entertainment section now has an ultra-subtle animated film grain + radial vignette overlay (8s shimmer loop, mix-blend-mode overlay) — giving the UI a cinematic, filmic quality like a high-end Blu-ray menu. Respects prefers-reduced-motion (disables instantly).

          **New: Changelog data system.**
          A structured `ent-changelog.ts` with typed entries (version / date / title / items / kind) covering the full history from v6.0.0 to v7.3.0. Future updates append entries here — they appear in the What's New panel automatically.

          All v7.2.0 functionality preserved: Statistics Dashboard, Collections, Discover, user ratings, reviews, tabbed detail panel, redesigned detail page, keep-alive home, Ken Burns hero, Because You Watched rail, settings panel, My List badge, Surprise/Settings shortcuts, toast notifications, Surprise Me, command palette (Ctrl+K), hero manual arrows + Up Next, NEW badges, card sheen, hover preview popovers, Top 10 rail, arrow-key nav, scroll-to-top FAB, keyboard shortcuts overlay, Recently Viewed rail, full CineSrc streaming playback, TMDB IPC in main process, mode switching, library, collections, platform detection, launching, playtime, achievements, overlay, console/desktop mode, themes, 4 first-party plugins.

          **Downloads:**
          - NEXUS-Setup-7.3.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-7.3.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
