name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Windows installer + portable
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing (no cert in CI) and skip publishing to a GH release
          # via electron-builder itself — we attach assets manually below.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "=== release/ contents ==="
          Get-ChildItem -Path release -Recurse | Format-Table Name, Length, FullName

      - name: Create GitHub Release and upload .exe assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v6.1.0"
          $title = "NEXUS v6.1.0 — NEXUS TV premium UX: hover preview cards, Top 10 rail, arrow-key nav, FAB, view transitions"
          $notes = @"
          NEXUS — Universal Game Launcher & Entertainment Hub for Windows.

          **v6.1.0 — Premium UX layer for NEXUS TV. Hover previews, ranked rails, keyboard navigation, and micro-animations that make it feel like a top-tier native OTT app.**

          **New: hover preview popover (Netflix-style).**
          Hover any card on a rail or grid for 450ms and a rich preview card lifts up showing the poster, title, year, type, a "% match" score, top genres, a 3-line overview, and quick **Watch** + **My List** actions — so you can decide or start watching without opening the full detail page. Cards at the right edge reposition the popover so it never clips off-screen.

          **New: Top 10 Movies Today rail.**
          A Netflix-style numbered row with giant stroked rose numerals (1-10) behind each poster. The top 3 get a brighter stroke + glow. Uses the Top Rated Movies feed, ranked.

          **New: arrow-key navigation (gamepad-like).**
          - ArrowLeft / ArrowRight — move focus across cards in the current rail/grid; the focused card auto-scrolls into view.
          - ArrowUp / ArrowDown — jump to the nearest card in the prev/next row (same column), with smooth scroll.
          - A clear rose focus ring (2px) appears on the focused card.
          - **g** — instant switch to Games mode. **/** — jump to Search. **Esc** — back.

          **New: scroll-to-top FAB.**
          A glass floating action button appears in the bottom-right after scrolling past 600px. Click (or it animates in) to smooth-scroll back to the top. Turns rose on hover.

          **New: view transitions.**
          Every view switch (Home → Movies → Detail → Search…) now fades + rises in over 350ms via a keyed wrapper, so navigation feels alive instead of instant-swap. Detail-page sections stagger in sequence.

          **Bug fix: hero was not full-bleed.**
          The floating clock used `float:right`, which caused the hero (and its backdrops) to wrap around the clock's footprint — shrinking the hero by ~124px on the right and leaving a black gap. Fixed by switching the clock to `position:fixed`, so it overlays without affecting flow. Hero is now true full-width (verified: hero width = body width).

          **Polish.**
          - Sidebar buttons now show a CSS tooltip label on hover (in addition to the native title).
          - Continue-Watching progress bars get a subtle live shine pulse.
          - Cards lift 2px on hover (whole wrap, not just the image).
          - Hero meta items get proper dot separators.
          - Full `prefers-reduced-motion` support — all new animations disable for users who prefer reduced motion.

          All v6.0.0 functionality preserved: full NEXUS TV design system, CineSrc streaming playback, TMDB IPC in main process, mode switching, library, collections, platform detection, launching, playtime, achievements, overlay, console/desktop mode, themes, 4 first-party plugins.

          **Downloads:**
          - NEXUS-Setup-6.1.0.exe — NSIS installer (recommended, supports auto-update).
          - NEXUS-Portable-6.1.0.exe — single-file portable build.

          Minimum: Windows 10 64-bit.
          "@

          # Create or update the release (idempotent). Use globs so the
          # workflow stays correct across version bumps.
          $setup = (Get-ChildItem release/NEXUS-Setup-*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/NEXUS-Portable-*.exe | Select-Object -First 1).FullName
          Write-Host "Setup: $setup"
          Write-Host "Portable: $portable"

          gh release create $tag $setup $portable `
            --title $title --notes $notes --target main 2>$null

          # If create failed because the release already exists, just re-upload the assets.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists — uploading assets to it."
            gh release upload $tag $setup $portable --clobber
          }

          Write-Host "=== Release assets ==="
          gh release view $tag --json assets --jq '.assets[] | "\(.name) - \(.size) bytes"'

      - name: Upload installer artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Setup
          path: release/NEXUS-Setup-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Upload portable artifact (best-effort)
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Portable
          path: release/NEXUS-Portable-*.exe
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true
